dataset: TUEV
source: configs/backbones/convnext_tiny_dinov3_unified/TUEV.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: gap
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Frozen linear probe for configs/backbones/convnext_tiny_dinov3_unified/TUEV.yaml.yaml: identical recipe
  with frozen=true, so only the classifier head is updated. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed.
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 2, ba: 0.53073, kappa: 0.66508, f1: 0.82472}
    43: {epoch: 5, ba: 0.55620, kappa: 0.65715, f1: 0.82136}
    44: {epoch: 3, ba: 0.55094, kappa: 0.66450, f1: 0.82381}
    45: {epoch: 2, ba: 0.52851, kappa: 0.65910, f1: 0.82179}
    46: {epoch: 2, ba: 0.53089, kappa: 0.66421, f1: 0.82414}
  mean: {ba: 0.53945, kappa: 0.66201, f1: 0.82316}
  std_population: {ba: 0.01168, kappa: 0.00324, f1: 0.00134}
output:
  model_root: experiments/checkpoints/linear_probe/convnext_tiny_dinov3_unified/tuev/seed{seed}
  log_root: experiments/logs/linear_probe/convnext_tiny_dinov3_unified/tuev/seed{seed}
