dataset: SHU-MI
source: configs/backbones/vit_small_dinov3/SHU-MI.yaml
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 2
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  time_roll_augmentation: false
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.58637, std: 0.01151}
  pr_auc: {mean: 0.64365, std: 0.01519}
  roc_auc: {mean: 0.61713, std: 0.01852}
notes: >-
  Matched-initialization control for configs/backbones/vit_small_dinov3/SHU-MI.yaml: identical recipe with
  use_pretrained_weights=false. Rerun (v2) with the current code (LMDB fork-safety fix,
  cls_token aggregation) and the profile aligned to early_stop 10 / num_workers 0.
  Five seeds 42--46, validation-selected checkpoint, one final test per seed.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/vit_small_dinov3_shu_mi_random_init_v2/{seed}
  log_root: experiments/logs/pretrain_vs_random/vit_small_dinov3_shu_mi_random_init_v2/{seed}
reshape_control:
  fold_mode: chunk
  source: configs/ablation_fold_geometry/vit_small_dinov3/shu_mi_chunk.yaml
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  mean:
    ba: 0.55186
    pr_auc: 0.59963
    roc_auc: 0.59721
  std_population:
    ba: 0.06521
    pr_auc: 0.10027
    roc_auc: 0.09103
  delta_vs_fold:
    ba: -0.07831
    pr_auc: -0.08942
    roc_auc: -0.09363
