dataset: SHU-MI
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 2}
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 20
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: flatten
  seeds: [42, 43, 44, 45, 46]
  mean: {ba: 0.59568, pr_auc: 0.66185, roc_auc: 0.63474}
  std_population: {ba: 0.00959, pr_auc: 0.01610, roc_auc: 0.01334}
head_comparison:
  cls_token:
    status: complete
    seeds: [42, 43, 44, 45, 46]
    mean: {ba: 0.60375, pr_auc: 0.66889, roc_auc: 0.65150}
    std_population: {ba: 0.00707, pr_auc: 0.00318, roc_auc: 0.01181}
  recommendation: cls_token
notes: >-
  Initial five-seed ViT-Small DINOv3 SHU-MI probe using P=2, clip=1024,
  scale=32, and the ConvNeXt schedule.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_shu_mi_p2_flatten_wd1e2_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_shu_mi_p2_flatten_wd1e2_5seed_v1/seed{seed}
