dataset: FACED
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter:
    fold_factor: 2
    fold_mode: chunk
  feature_aggregation: flatten
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 50
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 5
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/efficientnet_b0/FACED.yaml
  otherwise. Compare against the phase-interleaved fold baseline kappa 0.49533 +/-
  0.01970 recorded there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/efficientnet_b0/faced/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/efficientnet_b0/faced/seed{seed}
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.42217
      kappa: 0.34712
      f1: 0.42589
    43:
      ba: 0.28315
      kappa: 0.19388
      f1: 0.28309
    44:
      ba: 0.43693
      kappa: 0.36566
      f1: 0.44391
    45:
      ba: 0.40043
      kappa: 0.32413
      f1: 0.4028
    46:
      ba: 0.43653
      kappa: 0.36828
      f1: 0.44399
  mean:
    ba: 0.39584
    kappa: 0.31981
    f1: 0.39994
  std_population:
    ba: 0.05789
    kappa: 0.06492
    f1: 0.06035
  fold_baseline:
    ba:
      mean: 0.55164
      std: 0.0179
    kappa:
      mean: 0.49533
      std: 0.0197
    f1:
      mean: 0.55672
      std: 0.01626
