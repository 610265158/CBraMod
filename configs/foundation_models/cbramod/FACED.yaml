dataset: FACED
model_arch: cbramod
training:
  lr: 0.0001
  batch_size: 32
  epochs: 50
  weight_decay: 0.005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.55512
    std: 0.0107
  kappa:
    mean: 0.49612
    std: 0.01236
  f1:
    mean: 0.55535
    std: 0.01079
  per_seed:
    42:
      epoch: 47
      ba: 0.56065
      kappa: 0.50317
      f1: 0.56151
    43:
      epoch: 39
      ba: 0.54227
      kappa: 0.48199
      f1: 0.5441
    44:
      epoch: 43
      ba: 0.5632
      kappa: 0.5047
      f1: 0.56187
    45:
      epoch: 38
      ba: 0.54227
      kappa: 0.48054
      f1: 0.54097
    46:
      epoch: 39
      ba: 0.56723
      kappa: 0.51021
      f1: 0.56832
notes: >-
  Matched-pipeline CBraMod rerun on FACED. The per-dataset recipe from
  configs/downstream.py is used unchanged; the only adapted hyperparameter is
  the learning rate (1e-4). The loader normalizes inputs with the released
  CBraMod convention (microvolt / 100, no clipping), configured by
  finetune_main from configs/foundation.py. Validation-selected checkpoint,
  one final test per seed, seeds 42-46, population std. Published reference
  kappa 0.5041 +/- 0.0122 (delta -0.0080; 95% CI [0.4790, 0.5133] overlaps).
  See experiments/reports/foundation_rerun_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun/cbramod/seed{seed}
  log_root: experiments/logs/foundation_rerun/cbramod/seed{seed}
