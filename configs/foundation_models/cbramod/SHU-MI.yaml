dataset: SHU-MI
model_arch: cbramod
training:
  lr: 0.0001
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.62416
    std: 0.00496
  pr_auc:
    mean: 0.70214
    std: 0.01032
  roc_auc:
    mean: 0.68752
    std: 0.01223
  per_seed:
    42:
      epoch: 5
      ba: 0.62786
      pr_auc: 0.71387
      roc_auc: 0.70155
    43:
      epoch: 6
      ba: 0.62997
      pr_auc: 0.70292
      roc_auc: 0.68693
    44:
      epoch: 7
      ba: 0.6228
      pr_auc: 0.69973
      roc_auc: 0.68719
    45:
      epoch: 5
      ba: 0.6246
      pr_auc: 0.71007
      roc_auc: 0.6962
    46:
      epoch: 7
      ba: 0.61559
      pr_auc: 0.6841
      roc_auc: 0.66571
notes: >-
  Foundation rerun v2 record for CBraMod on SHU-MI (binary motor imagery).
  Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at factor 0.1, EMA
  0.995, weight decay 5e-4, gradient clipping 1.0, early stop 10) with 10
  epochs and pr_auc checkpoint selection from configs/downstream.py; the
  loader applies the released CBraMod normalization (microvolt / 100, no
  clipping). The released multi-LR schedule is not used; the whole network
  trains with a single 1e-4 learning rate (documented deviation).
  Validation-selected checkpoint, one final test per seed, seeds 42-46,
  population std. Published reference pr_auc 0.7139 +/- 0.0088 (delta
  -0.0118). See experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
