dataset: BCIC2020-3
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 1}
  feature_aggregation: flatten
  head_init_std: 0.002
training:
  lr: 1.0e-05
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 70
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 31, ba: 0.67733, kappa: 0.59667, f1: 0.67771}
    43: {epoch: 43, ba: 0.63467, kappa: 0.54333, f1: 0.63450}
    44: {epoch: 39, ba: 0.64000, kappa: 0.55000, f1: 0.63967}
    45: {epoch: 28, ba: 0.63200, kappa: 0.54000, f1: 0.63232}
    46: {epoch: 32, ba: 0.60933, kappa: 0.51167, f1: 0.60983}
  mean: {ba: 0.63867, kappa: 0.54833, f1: 0.63881}
  std_population: {ba: 0.02199, kappa: 0.02749, f1: 0.02197}
notes: >-
  Unified ConvNeXt-Tiny DINOv3 recipe: lr 1e-5 (documented exception), weight decay 5e-4, EMA 0.995,
  grad-norm clip 1.0, warmup 3 epochs, early stop 10, dropout 0.1,
  head_init_std 0.002, flatten aggregation. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed,
  population standard deviation. Primary metric 0.5560 -> 0.5483 (-0.0077 vs previous per-dataset recipe). lr is kept at 1e-5: the unified lr 1e-4
  collapses this dataset (train loss pinned at ln 5, kappa ~ 0).
  Per-seed values re-recorded from the w4 reproduction queue (2026-09-21).
output:
  model_root: experiments/checkpoints/bcic2020_3_convnext_tiny_dinov3_p1_flatten_lr1e5_unified_5seed_retry_v1/seed{seed}
  log_root: experiments/logs/bcic2020_3_convnext_tiny_dinov3_p1_flatten_lr1e5_unified_5seed_retry_v1/seed{seed}
