dataset: HMC
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 16}
  feature_aggregation: gap
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  mirror_augmentation: false
  time_roll_augmentation: false
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.75810, std: 0.00552}
  kappa: {mean: 0.71113, std: 0.00627}
  f1: {mean: 0.77440, std: 0.00433}
notes: >-
  HMC ConvNeXt-Tiny DINOv3 five-seed experiment. Four-channel 30-second
  epochs use P=16 phase-interleaved folding and GAP aggregation; no channel
  mirror or time-roll augmentation. Validation-selected checkpoint results
  are recorded after all five seeds, with one final test evaluation per seed.
output:
  model_root: experiments/checkpoints/hmc_convnext_tiny_dinov3_p16_gap_lr1e4_wd5e3_ema995_5seed_v1/seed{seed}
  log_root: experiments/logs/hmc_convnext_tiny_dinov3_p16_gap_lr1e4_wd5e3_ema995_5seed_v1/seed{seed}
