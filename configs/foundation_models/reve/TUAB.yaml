dataset: TUAB
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 5
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.80517
    std: 0.00715
  pr_auc:
    mean: 0.89006
    std: 0.01141
  roc_auc:
    mean: 0.88655
    std: 0.0122
  per_seed:
    42:
      epoch: 1
      ba: 0.81307
      pr_auc: 0.89492
      roc_auc: 0.89683
    43:
      epoch: 2
      ba: 0.81015
      pr_auc: 0.90418
      roc_auc: 0.89928
    44:
      epoch: 1
      ba: 0.80547
      pr_auc: 0.89699
      roc_auc: 0.88999
    45:
      epoch: 5
      ba: 0.79219
      pr_auc: 0.87239
      roc_auc: 0.86573
    46:
      epoch: 3
      ba: 0.80498
      pr_auc: 0.8818
      roc_auc: 0.88092
notes: >-
  Matched-pipeline REVE-Base rerun on TUAB. The per-dataset recipe from
  configs/downstream.py is used unchanged; the only adapted hyperparameter is
  the learning rate (1e-4). The loader normalizes inputs with the effective
  released REVE scale (microvolt / 100, no clipping) and supplies released
  electrode positions (16 bipolar channels, averaged by the position bank).
  Documented deviation: the released REVE TUAB pipeline uses a 21-channel
  memmap; this rerun feeds REVE the same 16-channel bipolar arrays as CBraMod.
  The REVE paper's lp -> ft warm start, mixup, StableAdamW, LoRA and model
  souping are not applied. Validation-selected checkpoint (validation PR-AUC),
  one final test per seed, seeds 42-46, population std. Published reference
  PR-AUC 0.9281 +/- 0.0009 (delta -0.0380; no interval overlap).
  See experiments/reports/foundation_rerun_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun/reve/seed{seed}
