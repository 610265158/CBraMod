dataset: CHB-MIT
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: true
  balanced_sampling_power: 1.0
  balanced_sampling_negative_ratio: 10.0
  mirror_augmentation: false
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  mean: {ba: 0.72782, pr_auc: 0.45657, roc_auc: 0.90536}
  std_population: {ba: 0.01053, pr_auc: 0.01308, roc_auc: 0.01143}
notes: CHB-MIT P ablation; same recipe as the original vit_small_dinov3 CHB-MIT config, with only fold factor changed to P=4.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/chb_mit_p4/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/chb_mit_p4/seed{seed}
