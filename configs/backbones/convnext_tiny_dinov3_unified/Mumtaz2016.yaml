dataset: Mumtaz2016
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: flatten
  head_init_std: 0.002
  squeeze_binary: true
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 17, ba: 0.91064, pr_auc: 0.97957, roc_auc: 0.97432}
    43: {epoch: 1, ba: 0.90158, pr_auc: 0.98064, roc_auc: 0.97872}
    44: {epoch: 3, ba: 0.92585, pr_auc: 0.98584, roc_auc: 0.98408}
    45: {epoch: 17, ba: 0.90478, pr_auc: 0.98281, roc_auc: 0.98067}
    46: {epoch: 14, ba: 0.89736, pr_auc: 0.96558, roc_auc: 0.95759}
  mean: {ba: 0.90804, pr_auc: 0.97889, roc_auc: 0.97508}
  std_population: {ba: 0.00990, pr_auc: 0.00699, roc_auc: 0.00929}
notes: >-
  Unified ConvNeXt-Tiny DINOv3 recipe: lr 1e-4, weight decay 5e-4, EMA 0.995,
  grad-norm clip 1.0, warmup 3 epochs, early stop 10, dropout 0.1,
  head_init_std 0.002, flatten aggregation. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed,
  population standard deviation. Primary metric 0.9842 -> 0.9789 (-0.0053 vs
  previous per-dataset recipe).
output:
  model_root: experiments/checkpoints/mumtaz2016_convnext_tiny_dinov3_p4_flatten_lr1e4_wd5e4_ema995_clip1_warm3_5seed_v1/seed{seed}
  log_root: experiments/logs/mumtaz2016_convnext_tiny_dinov3_p4_flatten_lr1e4_wd5e4_ema995_clip1_warm3_5seed_v1/seed{seed}
