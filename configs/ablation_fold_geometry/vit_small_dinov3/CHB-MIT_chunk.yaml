dataset: CHB-MIT
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 4
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: true
  balanced_sampling_power: 1.0
  balanced_sampling_negative_ratio: 10.0
  mirror_augmentation: false
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
head_comparison:
  cls_token:
    status: complete
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.73342
      pr_auc: 0.46393
      roc_auc: 0.91384
    std_population:
      ba: 0.01613
      pr_auc: 0.03429
      roc_auc: 0.00936
  recommendation: cls_token
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/vit_small_dinov3/CHB-MIT.yaml
  otherwise. Compare against the phase-interleaved fold baseline PR-AUC 0.45657 recorded
  there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/chb_mit/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/chb_mit/seed{seed}
