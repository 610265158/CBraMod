dataset:
- CHB-MIT
- TUEV
- SEED-V
- SHU-MI
- BCIC2020-3
- ISRUC
- MentalArithmetic
model_arch: reve
training:
  lr: 0.0001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  ema_decay: 0.995
  weight_decay: 0.0005
  clip_value: 1.0
  early_stop: 10
  num_workers: 0
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Foundation rerun v2 recipe extended to the seven datasets outside the first
  five-dataset sweep. Recipe: lr 1e-4, warmup 3 epochs at factor 0.1, EMA 0.995,
  weight decay 5e-4, gradient clipping 1.0, early stop 10; per-dataset epochs
  (and batch size) keep their configs/downstream.py values, with each
  dataset's selection metric. Per-dataset input scales follow the released REVE
  task configs where they exist: TUEV 100 (the released volt-scale memmap
  factor x1e4, equivalent to microvolt / 100, as already documented for TUAB),
  ISRUC 10 (the released loader constant), BCIC2020-3 and MentalArithmetic 1000
  (released scale_factor). CHB-MIT, SEED-V and SHU-MI are NOT part of the
  released REVE benchmark, so they use fallback specs: microvolt / 100,
  pooling='last', dropout 0.5, and must be reported as reference-only
  deviations; SEED-V's CB1/CB2 are mapped to the inferior occipital OI1h/OI2h
  because the position bank has no cerebellar entries. The released lp -> ft
  warm start, mixup,   StableAdamW, LoRA and souping remain unapplied. ISRUC's 4D
  [B,20,6,6000] batches are flattened to [B*20,6,6000] inside the wrapper and
  the logits are folded back to [B,20,classes]; REVE ISRUC runs at batch 8
  instead of the configured 16 because the 22-layer encoder exceeds 23.5 GiB
  at batch 16 (CUDA OOM), the only batch-size deviation in this sweep. Run with
  `bash experiments/run_downstream.sh --config <this file>`; pass
  --num_workers 4 for the non-LMDB datasets (CHB-MIT, TUEV, ISRUC).
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
