dataset: BCIC2020-3
model_arch: cbramod
training:
  lr: 0.0001
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.5952
    std: 0.01035
  kappa:
    mean: 0.494
    std: 0.01294
  f1:
    mean: 0.59485
    std: 0.01042
  per_seed:
    42:
      epoch: 27
      ba: 0.588
      kappa: 0.485
      f1: 0.58791
    43:
      epoch: 30
      ba: 0.58533
      kappa: 0.48167
      f1: 0.58449
    44:
      epoch: 27
      ba: 0.6
      kappa: 0.5
      f1: 0.5997
    45:
      epoch: 28
      ba: 0.58933
      kappa: 0.48667
      f1: 0.58909
    46:
      epoch: 29
      ba: 0.61333
      kappa: 0.51667
      f1: 0.61304
notes: >-
  Foundation rerun v2 record for CBraMod on BCIC2020-3 (5-class imagined
  speech). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at factor
  0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop 10)
  with 30 epochs and kappa checkpoint selection from configs/downstream.py;
  the loader applies the released CBraMod normalization (microvolt / 100, no
  clipping). The released multi-LR schedule is not used; the whole network
  trains with a single 1e-4 learning rate (documented deviation).
  Validation-selected checkpoint, one final test per seed, seeds 42-46,
  population std. Published reference kappa 0.4216 +/- 0.0163 (delta +0.0724).
  See experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
