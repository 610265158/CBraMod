dataset: MentalArithmetic
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision: {adapter: {fold_factor: 2}, squeeze_binary: true, feature_aggregation: flatten, head_init_std: 0.02}
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol: {seeds: [42, 43, 44, 45, 46], selection: validation_selected_checkpoint_once_on_test}
results:
  protocol: validation_selected_checkpoint_once_on_test
  per_seed:
    42: {ba: 0.76736, pr_auc: 0.80453, roc_auc: 0.89453}
    43: {ba: 0.80556, pr_auc: 0.82339, roc_auc: 0.90451}
    44: {ba: 0.79861, pr_auc: 0.76874, roc_auc: 0.88730}
    45: {ba: 0.80903, pr_auc: 0.78923, roc_auc: 0.90394}
    46: {ba: 0.83333, pr_auc: 0.83094, roc_auc: 0.90972}
  mean: {ba: 0.80278, pr_auc: 0.80337, roc_auc: 0.90000}
  std_population: {ba: 0.02122, pr_auc: 0.02263, roc_auc: 0.00802}
notes: MentalArithmetic P ablation; identical to the existing ViT-Small DINOv3 recipe except fold factor P=2.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/mentalarithmetic_p2/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/mentalarithmetic_p2/seed{seed}
