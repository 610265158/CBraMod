  clip_value: 1.0
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {ba: 0.62153, pr_auc: 0.52441, roc_auc: 0.76027}
    43: {ba: 0.63889, pr_auc: 0.54306, roc_auc: 0.72743}
    44: {ba: 0.66319, pr_auc: 0.63232, roc_auc: 0.79036}
