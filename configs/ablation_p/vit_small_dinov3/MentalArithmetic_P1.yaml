dataset: MentalArithmetic
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision: {adapter: {fold_factor: 1}, squeeze_binary: true, feature_aggregation: cls_token, head_init_std: 0.02}
training:
  lr: 0.0005
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol: {seeds: [42, 43, 44, 45, 46], selection: validation_selected_checkpoint_once_on_test}
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: cls_token
  lr: 0.0005
  clip_value: 1.0
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {ba: 0.76042, pr_auc: 0.75874, roc_auc: 0.88701}
    43: {ba: 0.75347, pr_auc: 0.77800, roc_auc: 0.88469}
    44: {ba: 0.72569, pr_auc: 0.75955, roc_auc: 0.88137}
    45: {ba: 0.81250, pr_auc: 0.82989, roc_auc: 0.92072}
    46: {ba: 0.75694, pr_auc: 0.78058, roc_auc: 0.89728}
  mean: {ba: 0.76180, pr_auc: 0.78135, roc_auc: 0.89421}
  std_population: {ba: 0.02818, pr_auc: 0.02590, roc_auc: 0.01428}
notes: MentalArithmetic P ablation; corrected CLS-token ViT recipe (cls_token, lr 5e-4, clip 1), fold factor P=1. Five seeds, validation-selected checkpoint, one final test per seed; corrected-recipe rerun completed 2026-09-15.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/mentalarithmetic_p1_clstoken_lr5e4_clip1/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/mentalarithmetic_p1_clstoken_lr5e4_clip1/seed{seed}
