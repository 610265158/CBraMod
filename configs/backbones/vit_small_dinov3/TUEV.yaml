dataset: TUEV
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: flatten
  seeds: [42, 43, 44, 45, 46]
  mean: {ba: 0.72170, kappa: 0.72625, f1: 0.85629}
  std_population: {ba: 0.00621, kappa: 0.00426, f1: 0.00293}
head_comparison:
  cls_token:
    status: pending
    completed_seeds: []
  recommendation: pending
notes: >-
  Initial five-seed ViT-Small DINOv3 TUEV probe using P=4, three-epoch warmup,
  EMA decay 0.995, no augmentation, and a ten-epoch schedule.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_tuev_p4_flatten_wd1e2_10ep_ema995_warmup3_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_tuev_p4_flatten_wd1e2_10ep_ema995_warmup3_5seed_v1/seed{seed}
