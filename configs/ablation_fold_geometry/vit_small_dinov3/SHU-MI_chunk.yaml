dataset: SHU-MI
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 2
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 20
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) on the
  updated CLS-token ViT recipe. Identical to configs/backbones/vit_small_dinov3/SHU-MI.yaml
  otherwise (cls_token aggregation, lr 5e-4, clip 1). Compare against the phase-interleaved
  fold baseline recorded there: {''ba'': 0.63017, ''pr_auc'': 0.68905, ''roc_auc'':
  0.69084}.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/shu_mi/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/shu_mi/seed{seed}
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.49729
      pr_auc: 0.5255
      roc_auc: 0.53513
    43:
      ba: 0.63554
      pr_auc: 0.72251
      roc_auc: 0.71133
    44:
      ba: 0.62778
      pr_auc: 0.72108
      roc_auc: 0.70436
    45:
      ba: 0.5
      pr_auc: 0.52947
      roc_auc: 0.53183
    46:
      ba: 0.49867
      pr_auc: 0.49959
      roc_auc: 0.50342
  mean:
    ba: 0.55186
    pr_auc: 0.59963
    roc_auc: 0.59721
  std_population:
    ba: 0.06521
    pr_auc: 0.10027
    roc_auc: 0.09103
  fold_baseline:
    protocol: validation_selected_checkpoint_once_on_test
    feature_aggregation: cls_token
    lr: 0.0005
    clip_value: 1.0
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.63017
      pr_auc: 0.68905
      roc_auc: 0.69084
    std_population:
      ba: 0.03305
      pr_auc: 0.04575
      roc_auc: 0.04521
