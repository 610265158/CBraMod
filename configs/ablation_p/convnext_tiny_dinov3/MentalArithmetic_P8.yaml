dataset: MentalArithmetic
backbone_name: convnext_tiny.dinov3_lvd1689m
vision: {adapter: {fold_factor: 8}, squeeze_binary: true, feature_aggregation: flatten, head_init_std: 0.002}
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol: {seeds: [42, 43, 44, 45, 46], selection: validation_selected_checkpoint_once_on_test}
results:
  protocol: validation_selected_checkpoint_once_on_test
  per_seed:
    42: {ba: 0.62153, pr_auc: 0.39220, roc_auc: 0.67216}
    43: {ba: 0.63194, pr_auc: 0.48945, roc_auc: 0.67564}
    44: {ba: 0.59722, pr_auc: 0.38746, roc_auc: 0.64077}
    45: {ba: 0.68403, pr_auc: 0.52285, roc_auc: 0.74754}
    46: {ba: 0.62847, pr_auc: 0.55963, roc_auc: 0.67650}
  mean: {ba: 0.63264, pr_auc: 0.47032, roc_auc: 0.68252}
  std_population: {ba: 0.02841, pr_auc: 0.06938, roc_auc: 0.03510}
notes: MentalArithmetic P ablation; identical to the existing ConvNeXt-Tiny DINOv3 recipe except fold factor P=8.
output:
  model_root: experiments/checkpoints/ablation_p/convnext_tiny_dinov3/mentalarithmetic_p8/seed{seed}
  log_root: experiments/logs/ablation_p/convnext_tiny_dinov3/mentalarithmetic_p8/seed{seed}
