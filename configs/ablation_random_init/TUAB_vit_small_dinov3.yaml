dataset: TUAB
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.77585, std: 0.00575}
  pr_auc: {mean: 0.84645, std: 0.00559}
  roc_auc: {mean: 0.85136, std: 0.00514}
results:
  ba: {mean: 0.77585, std: 0.00575}
  pr_auc: {mean: 0.84645, std: 0.00559}
  roc_auc: {mean: 0.85136, std: 0.00514}
notes: >-
  Pretrain-vs-random ablation: vit_small_dinov3 architecture with random initialization
  (use_pretrained_weights=false). Matches the TUAB pretrained recipe; only
  the initialization differs.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/vit_small_dinov3_TUAB_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/vit_small_dinov3_TUAB_random_init/{seed}
