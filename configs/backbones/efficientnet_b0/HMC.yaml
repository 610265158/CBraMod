dataset: HMC
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
training:
  lr: 0.001
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  mirror_augmentation: false
  time_roll_augmentation: false
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
vision:
  adapter:
    fold_factor: 16
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.75565, std: 0.00189}
  kappa: {mean: 0.70701, std: 0.00231}
  f1: {mean: 0.77002, std: 0.00173}
notes: >-
  Finalized five-seed HMC sleep staging recipe (seeds 42--46), using
  validation-selected checkpoints and one final test evaluation per seed.
  Preprocess the signal EDFs and their *_sleepscoring.txt annotations with
  preprocessing_hmc.py first.
