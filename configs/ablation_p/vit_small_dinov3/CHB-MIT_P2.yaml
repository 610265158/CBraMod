dataset: CHB-MIT
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 2}
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: true
  balanced_sampling_power: 1.0
  balanced_sampling_negative_ratio: 10.0
  mirror_augmentation: false
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: cls_token
  lr: 0.0005
  clip_value: 1.0
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {ba: 0.65738, pr_auc: 0.37879, roc_auc: 0.89277}
    43: {ba: 0.73612, pr_auc: 0.44873, roc_auc: 0.91221}
    44: {ba: 0.64533, pr_auc: 0.39576, roc_auc: 0.91767}
    45: {ba: 0.65931, pr_auc: 0.45311, roc_auc: 0.90393}
    46: {ba: 0.66905, pr_auc: 0.44130, roc_auc: 0.90591}
  mean: {ba: 0.67344, pr_auc: 0.42354, roc_auc: 0.90650}
  std_population: {ba: 0.03224, pr_auc: 0.03033, roc_auc: 0.00840}
notes: CHB-MIT P ablation; corrected CLS-token ViT recipe (cls_token, lr 5e-4, clip 1), fold factor P=2. Five seeds, validation-selected checkpoint, one final test per seed; corrected-recipe rerun completed 2026-09-15.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/chb_mit_p2_clstoken_lr5e4_clip1/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/chb_mit_p2_clstoken_lr5e4_clip1/seed{seed}
