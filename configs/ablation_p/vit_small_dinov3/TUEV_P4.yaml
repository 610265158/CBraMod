dataset: TUEV
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: cls_token
  lr: 0.0005
  clip_value: 1.0
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {ba: 0.72881, kappa: 0.75002, f1: 0.86841}
    43: {ba: 0.74790, kappa: 0.74863, f1: 0.86856}
    44: {ba: 0.72991, kappa: 0.75923, f1: 0.87241}
    45: {ba: 0.71446, kappa: 0.72958, f1: 0.86003}
    46: {ba: 0.70927, kappa: 0.72636, f1: 0.85811}
  mean: {ba: 0.72607, kappa: 0.74276, f1: 0.86550}
  std_population: {ba: 0.01353, kappa: 0.01266, f1: 0.00548}
notes: TUEV P ablation; corrected CLS-token ViT recipe (cls_token, lr 5e-4, clip 1), fold factor P=4. The P=4 row equals the finalized main recipe (configs/backbones/vit_small_dinov3/TUEV.yaml); reused rather than rerun. Five seeds, validation-selected checkpoint, one final test per seed.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/tuev_p4_clstoken_lr5e4_clip1/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/tuev_p4_clstoken_lr5e4_clip1/seed{seed}

