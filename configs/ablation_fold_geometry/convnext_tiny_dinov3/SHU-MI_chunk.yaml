dataset: SHU-MI
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter:
    fold_factor: 2
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: flatten
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 20
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/convnext_tiny_dinov3/SHU-MI.yaml
  otherwise. Compare against the phase-interleaved fold baseline PR-AUC 0.69096 +/-
  0.01290 recorded there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/convnext_tiny_dinov3/shu_mi/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/convnext_tiny_dinov3/shu_mi/seed{seed}
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.61977
      pr_auc: 0.68401
      roc_auc: 0.69727
    43:
      ba: 0.65215
      pr_auc: 0.70742
      roc_auc: 0.71737
    44:
      ba: 0.60805
      pr_auc: 0.70751
      roc_auc: 0.71176
    45:
      ba: 0.6221
      pr_auc: 0.69402
      roc_auc: 0.68931
    46:
      ba: 0.5
      pr_auc: 0.61799
      roc_auc: 0.61662
  mean:
    ba: 0.60041
    pr_auc: 0.68219
    roc_auc: 0.68647
  std_population:
    ba: 0.05227
    pr_auc: 0.03329
    roc_auc: 0.03633
  fold_baseline:
    ba:
      mean: 0.63579
      std: 0.00752
    pr_auc:
      mean: 0.69096
      std: 0.0129
    roc_auc:
      mean: 0.70055
      std: 0.01123
