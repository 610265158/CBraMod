    43: {epoch: 7, ba: 0.64833, kappa: 0.53112, f1: 0.64929}
    44: {epoch: 6, ba: 0.65724, kappa: 0.54296, f1: 0.65804}
    45: {epoch: 6, ba: 0.66333, kappa: 0.55109, f1: 0.66462}
    46: {epoch: 8, ba: 0.65003, kappa: 0.53338, f1: 0.64934}
  mean: {ba: 0.65579, kappa: 0.54105, f1: 0.65638}
  std_population: {ba: 0.00575, kappa: 0.00766, f1: 0.00614}
notes: >-
  Unified ConvNeXt-Tiny DINOv3 recipe: lr 1e-4, weight decay 5e-4, EMA 0.995,
  grad-norm clip 1.0, warmup 3 epochs, early stop 10, dropout 0.1,
  head_init_std 0.002, flatten aggregation. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed,
  population standard deviation. Primary metric 0.5478 -> 0.5410 (-0.0068 vs previous per-dataset recipe).
  Per-seed values re-recorded from the w4 reproduction queue (2026-09-21).
output:
