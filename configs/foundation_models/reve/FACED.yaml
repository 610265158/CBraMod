dataset: FACED
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 50
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.51272
    std: 0.0249
  kappa:
    mean: 0.45051
    std: 0.02738
  f1:
    mean: 0.51393
    std: 0.02381
  per_seed:
    42:
      epoch: 9
      ba: 0.48376
      kappa: 0.41888
      f1: 0.48575
    43:
      epoch: 21
      ba: 0.54804
      kappa: 0.48978
      f1: 0.54774
    44:
      epoch: 4
      ba: 0.49235
      kappa: 0.42855
      f1: 0.49551
    45:
      epoch: 21
      ba: 0.53556
      kappa: 0.47528
      f1: 0.53576
    46:
      epoch: 6
      ba: 0.50389
      kappa: 0.44006
      f1: 0.5049
notes: >-
  Foundation rerun v2 record for REVE-Base on FACED (9-class emotion
  recognition). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at
  factor 0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop
  10) with 50 epochs and kappa checkpoint selection from
  configs/downstream.py; the loader applies the released REVE scale_factor
  (microvolt / 1000, no clipping) and supplies released electrode positions
  (32 channels). The released lp -> ft warm start, mixup, StableAdamW, LoRA
  and model souping are not applied (documented deviation).
  Validation-selected checkpoint, one final test per seed, seeds 42-46,
  population std. Published reference kappa 0.5080 +/- 0.0191 (delta -0.0575).
  Replaces the v1 matched-pipeline record (kappa 0.4190 +/- 0.0063). See
  experiments/reports/foundation_rerun_v2_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
