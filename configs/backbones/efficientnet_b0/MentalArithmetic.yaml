dataset: MentalArithmetic
backbone_name: efficientnet_b0
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 64
  epochs: 30
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  mental_scale: 32.0
  shu_clip_limit: 512.0
  shu_scale: 64.0
  shu_bandpass_low: null
  shu_bandpass_high: null
  shu_filter_order: 4
  physio_lowpass_hz: null
  physio_filter_order: 4
  mumtaz_lowpass_hz: null
  mumtaz_filter_order: 4
  faced_input_norm: clip_scale
  faced_robust_clip: 8.0
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol: {seeds: [42, 43, 44, 45, 46], selection: validation_selected_checkpoint_once_on_test}
results:
  pr_auc: {mean: 0.79029, std: 0.05364}
  roc_auc: {mean: 0.87789, std: 0.02513}
notes: Finalized five-seed recipe; population standard deviation and one final test evaluation per seed.
output:
  model_root: experiments/checkpoints/mentalarithmetic_p4_headstd002_ema995_5seed_v1/seed{seed}
  log_root: experiments/logs/mentalarithmetic_p4_headstd002_ema995_5seed_v1/seed{seed}
