dataset: SEED-V
model_arch: reve
training:
  lr: 2.0e-05
  batch_size: 32
  epochs: 50
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.40656
    std: 0.00506
  kappa:
    mean: 0.25778
    std: 0.00619
  f1:
    mean: 0.41135
    std: 0.00506
  per_seed:
    42:
      epoch: 7
      ba: 0.4147
      kappa: 0.26784
      f1: 0.41954
    43:
      epoch: 4
      ba: 0.40723
      kappa: 0.25862
      f1: 0.41158
    44:
      epoch: 11
      ba: 0.40787
      kappa: 0.25938
      f1: 0.41341
    45:
      epoch: 6
      ba: 0.39943
      kappa: 0.24942
      f1: 0.40512
    46:
      epoch: 5
      ba: 0.40357
      kappa: 0.25366
      f1: 0.40711
notes: >-
  Foundation rerun v2 record for REVE-Base on SEED-V (5-class emotion
  recognition). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at
  factor 0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop
  10) with 50 epochs and kappa checkpoint selection from
  configs/downstream.py; the loader applies a fallback microvolt / 100 without
  clipping (this dataset is not part of the released REVE benchmark) and
  supplies position-bank coordinates for 62 channels. The released lp -> ft
  warm start, mixup, StableAdamW, LoRA and model souping are not applied
  (documented deviation). Validation-selected checkpoint, one final test per
  seed, seeds 42-46, population std. SEED-V is not part of the released REVE
  benchmark; the input scale (microvolt / 100) is a fallback setting and this
  record is reference-only. The pooled-token readout stays at chance here
  (five-seed kappa 0.078), so the non-pooling readout is used, and the run
  uses a per-dataset learning rate of 2e-5 because at the campaign rate one of
  five seeds stays in the chance basin (kappa 0.089 versus 0.25 at 2e-5).
  CB1/CB2 map to the inferior occipital OI1h/OI2h positions because the
  released position bank has no cerebellar entries. See
  experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1_seedv_poolno_lr2e5_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1_seedv_poolno_lr2e5_v1/reve/seed{seed}
