dataset: MentalArithmetic
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision: {adapter: {fold_factor: 4}, squeeze_binary: true, feature_aggregation: flatten, head_init_std: 0.02}
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol: {seeds: [42, 43, 44, 45, 46], selection: validation_selected_checkpoint_once_on_test}
results:
  protocol: validation_selected_checkpoint_once_on_test
  per_seed:
    42: {ba: 0.71528, pr_auc: 0.58445, roc_auc: 0.77879}
    43: {ba: 0.77431, pr_auc: 0.68725, roc_auc: 0.82899}
    44: {ba: 0.67014, pr_auc: 0.51415, roc_auc: 0.72309}
    45: {ba: 0.68750, pr_auc: 0.52656, roc_auc: 0.72830}
    46: {ba: 0.71181, pr_auc: 0.55730, roc_auc: 0.75014}
  mean: {ba: 0.71181, pr_auc: 0.57394, roc_auc: 0.76186}
  std_population: {ba: 0.03534, pr_auc: 0.06172, roc_auc: 0.03888}
notes: MentalArithmetic P ablation; existing ViT-Small DINOv3 recipe with fold factor P=4.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/mentalarithmetic_p4/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/mentalarithmetic_p4/seed{seed}
