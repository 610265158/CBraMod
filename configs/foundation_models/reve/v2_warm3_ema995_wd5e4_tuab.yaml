dataset: TUAB
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  warmup_epochs: 3
  warmup_start_factor: 0.1
  ema_decay: 0.995
  weight_decay: 0.0005
  clip_value: 1.0
  early_stop: 10
  epochs: 10
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  TUAB variant of the foundation rerun v2 recipe for REVE-Base: same overrides
  as v2_warm3_ema995_wd5e4.yaml (including gradient clipping at 1.0) plus 10
  epochs (5 in configs/downstream.py).
  Requires the node that holds the TUAB data. Run with
  `bash experiments/run_downstream.sh --config <this file>`; seeds 42-46 come
  from the protocol section.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
