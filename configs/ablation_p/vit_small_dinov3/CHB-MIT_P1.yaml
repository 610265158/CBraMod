dataset: CHB-MIT
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 1}
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: true
  balanced_sampling_power: 1.0
  balanced_sampling_negative_ratio: 10.0
  mirror_augmentation: false
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: cls_token
  lr: 0.0005
  clip_value: 1.0
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {ba: 0.68335, pr_auc: 0.35766, roc_auc: 0.91764}
    43: {ba: 0.68216, pr_auc: 0.28292, roc_auc: 0.89884}
    44: {ba: 0.67897, pr_auc: 0.31534, roc_auc: 0.91565}
    45: {ba: 0.68658, pr_auc: 0.41114, roc_auc: 0.90750}
    46: {ba: 0.71076, pr_auc: 0.39630, roc_auc: 0.91073}
  mean: {ba: 0.68836, pr_auc: 0.35267, roc_auc: 0.91007}
  std_population: {ba: 0.01146, pr_auc: 0.04818, roc_auc: 0.00666}
notes: CHB-MIT P ablation; corrected CLS-token ViT recipe (cls_token, lr 5e-4, clip 1), fold factor P=1. Five seeds, validation-selected checkpoint, one final test per seed; corrected-recipe rerun completed 2026-09-15.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/chb_mit_p1_clstoken_lr5e4_clip1/seed{seed}
  log_root: experiments/logs/ablation_p/vit_small_dinov3/chb_mit_p1_clstoken_lr5e4_clip1/seed{seed}
