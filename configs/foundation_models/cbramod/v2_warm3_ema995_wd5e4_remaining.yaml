dataset:
- CHB-MIT
- TUEV
- SEED-V
- SHU-MI
- BCIC2020-3
- ISRUC
- MentalArithmetic
model_arch: cbramod
training:
  lr: 0.0001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  ema_decay: 0.995
  weight_decay: 0.0005
  clip_value: 1.0
  early_stop: 10
  num_workers: 0
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Foundation rerun v2 recipe extended to the seven datasets outside the first
  five-dataset sweep (CHB-MIT, TUEV, SEED-V, SHU-MI, BCIC2020-3, ISRUC,
  MentalArithmetic). Recipe: lr 1e-4, warmup 3 epochs at factor 0.1, EMA 0.995,
  weight decay 5e-4, gradient clipping 1.0, early stop 10; per-dataset epochs
  (and batch size) keep their configs/downstream.py values, i.e. 10/10/50/10/30
  epochs for CHB-MIT/TUEV/SEED-V/SHU-MI/BCIC2020-3 and 15/30 for
  ISRUC/MentalArithmetic, with each dataset's selection metric. Run with
  `bash experiments/run_downstream.sh --config <this file>` (seeds 42-46 come
  from the protocol section); pass --num_workers 4 for the non-LMDB datasets
  (CHB-MIT, TUEV, ISRUC) and --foundation_dir as needed. CBraMod keeps the
  released microvolt / 100 convention for every dataset; ISRUC's 4D
  [B,20,6,6000] batches are flattened to [B*20,6,6000] inside the wrapper and
  the logits are folded back to [B,20,classes]. Output goes to the existing v2
  roots, whose per-dataset subdirectories are disjoint from the five-dataset
  sweep.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
