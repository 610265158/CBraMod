dataset: TUEV
backbone_name: efficientnet_b0
vision:
  adapter: {fold_factor: 4, fold_mode: phase_shuffle}
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Fold-geometry control: phase-order permutation. Identical to the finalized
  TUEV recipe except fold_mode=phase_shuffle, which keeps the phase-interleaved
  samples but permutes the P=4 phase rows by a fixed random permutation
  (shuffle_seed 7 -> phase order [3,2,0,1]). Content and image shape are
  unchanged [B,1,64,256]; only phase adjacency is destroyed. Compare against
  the finalized phase-interleaved kappa 0.69009 +/- 0.01896.
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/tuev_phase_shuffle/{seed}
  log_root: experiments/logs/ablation_fold_geometry/tuev_phase_shuffle/{seed}
