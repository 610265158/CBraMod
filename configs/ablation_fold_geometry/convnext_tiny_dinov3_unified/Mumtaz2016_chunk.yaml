dataset: Mumtaz2016
source: configs/backbones/convnext_tiny_dinov3_unified/Mumtaz2016.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 4, fold_mode: chunk}
  feature_aggregation: flatten
  head_init_std: 0.002
  squeeze_binary: true
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Fold-vs-reshape control for the unified ConvNeXt-Tiny DINOv3 recipe:
  contiguous-chunk reshape (fold_mode=chunk) instead of phase-interleaved
  folding. Identical to configs/backbones/convnext_tiny_dinov3_unified/Mumtaz2016.yaml
  otherwise; compare against the phase-interleaved fold baseline recorded there.
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/convnext_tiny_dinov3_unified/mumtaz2016/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/convnext_tiny_dinov3_unified/mumtaz2016/seed{seed}
