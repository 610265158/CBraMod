dataset: TUEV
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 4
    fold_mode: chunk
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) on the
  updated CLS-token ViT recipe. Identical to configs/backbones/vit_small_dinov3/TUEV.yaml
  otherwise (cls_token aggregation, lr 5e-4, clip 1). Compare against the phase-interleaved
  fold baseline recorded there: {''ba'': 0.72607, ''kappa'': 0.74276, ''f1'': 0.8655}.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/tuev/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/tuev/seed{seed}
