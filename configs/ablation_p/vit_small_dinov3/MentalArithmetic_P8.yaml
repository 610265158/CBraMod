    46: {ba: 0.65278, pr_auc: 0.55454, roc_auc: 0.75145}
  mean: {ba: 0.65000, pr_auc: 0.55647, roc_auc: 0.75257}
  std_population: {ba: 0.01829, pr_auc: 0.03943, roc_auc: 0.02231}
notes: MentalArithmetic P ablation; corrected CLS-token ViT recipe (cls_token, lr 5e-4, clip 1), fold factor P=8. Five seeds, validation-selected checkpoint, one final test per seed; corrected-recipe rerun completed 2026-09-15.
output:
  model_root: experiments/checkpoints/ablation_p/vit_small_dinov3/mentalarithmetic_p8_clstoken_lr5e4_clip1/seed{seed}
