dataset: BCIC2020-3
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 1
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
    42:
      ba: 0.296
      kappa: 0.12
      f1: 0.29511
    43:
      ba: 0.28933
      kappa: 0.11167
      f1: 0.28792
    44:
      ba: 0.31733
      kappa: 0.14667
      f1: 0.31666
    45:
      ba: 0.32933
      kappa: 0.16167
      f1: 0.32835
    46:
      ba: 0.31733
      kappa: 0.14667
      f1: 0.31701
  mean:
    ba: 0.309864
    kappa: 0.137336
    f1: 0.30901
  std_population:
    ba: 0.014861
    kappa: 0.018578
    f1: 0.015064
head_comparison:
  cls_token:
    status: complete
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.60213
      kappa: 0.50267
      f1: 0.60205
    std_population:
      ba: 0.01705
      kappa: 0.02131
      f1: 0.01716
  recommendation: flatten
notes: BCIC2020-3 five-seed ViT-Small DINOv3 probe. The model uses vit_small_patch16_dinov3.lvd1689m
  with P=1 phase-interleaved input folding, flatten token aggregation, a 0.02 truncated-normal
  classifier head, and the ConvNeXt comparison schedule (lr=1e-4, 30 epochs, EMA 0.995,
  clip=1, time-roll augmentation). Results remain empty until validation-selected
  checkpoints have been evaluated once on test for every seed. Population standard
  deviations are recorded above.
output:
  model_root: experiments/checkpoints/bcic2020_3_vit_small_dinov3_p1_flatten_wd1e2_5seed_v1/seed{seed}
  log_root: experiments/logs/bcic2020_3_vit_small_dinov3_p1_flatten_wd1e2_5seed_v1/seed{seed}
