      pr_auc: 0.97921
      roc_auc: 0.97865
    45:
      ba: 0.82868
      pr_auc: 0.95676
      roc_auc: 0.92912
    46:
      ba: 0.88239
      pr_auc: 0.96777
      roc_auc: 0.96049
  mean:
    ba: 0.88567
    pr_auc: 0.97292
    roc_auc: 0.9642
