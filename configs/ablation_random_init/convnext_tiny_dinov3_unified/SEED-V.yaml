dataset: SEED-V
source: configs/backbones/convnext_tiny_dinov3_unified/SEED-V.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 1}
  feature_aggregation: flatten
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 50
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 13, ba: 0.36366, kappa: 0.21086, f1: 0.37362}
    43: {epoch: 29, ba: 0.35772, kappa: 0.20504, f1: 0.36998}
    44: {epoch: 32, ba: 0.36584, kappa: 0.21389, f1: 0.37681}
    45: {epoch: 30, ba: 0.36116, kappa: 0.21002, f1: 0.37380}
    46: {epoch: 19, ba: 0.35206, kappa: 0.19613, f1: 0.36282}
  mean: {ba: 0.36009, kappa: 0.20719, f1: 0.37141}
  std_population: {ba: 0.00484, kappa: 0.00622, f1: 0.00481}
notes: >-
  Matched-initialization control for configs/backbones/convnext_tiny_dinov3_unified/SEED-V.yaml.yaml:
  the recipe is identical (only use_pretrained_weights=false differs). Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed; std is the population
  standard deviation. Primary metric delta (pretrained minus random): +2.79 pp.
  Per-seed values re-recorded from the w4 reproduction queue (2026-09-21).
output:
  model_root: experiments/checkpoints/pretrain_vs_random/convnext_tiny_dinov3_unified_seed_v_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/convnext_tiny_dinov3_unified_seed_v_random_init/{seed}
