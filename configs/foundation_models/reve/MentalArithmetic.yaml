dataset: MentalArithmetic
model_arch: reve
training:
  lr: 0.0001
  batch_size: 64
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.67361
    std: 0.0412
  pr_auc:
    mean: 0.66794
    std: 0.08222
  roc_auc:
    mean: 0.78964
    std: 0.10355
  per_seed:
    42:
      epoch: 25
      ba: 0.66319
      pr_auc: 0.66223
      roc_auc: 0.85663
    43:
      epoch: 24
      ba: 0.63542
      pr_auc: 0.66282
      roc_auc: 0.82523
    44:
      epoch: 30
      ba: 0.66319
      pr_auc: 0.57922
      roc_auc: 0.6101
    45:
      epoch: 28
      ba: 0.75347
      pr_auc: 0.81997
      roc_auc: 0.9077
    46:
      epoch: 13
      ba: 0.65278
      pr_auc: 0.61546
      roc_auc: 0.74855
notes: >-
  Foundation rerun v2 record for REVE-Base on MentalArithmetic (binary mental
  workload). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at factor
  0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop 10)
  with 30 epochs and pr_auc checkpoint selection from configs/downstream.py;
  the loader applies the released REVE scale_factor (microvolt / 1000, no
  clipping) and supplies released electrode positions (20 channels). The
  released lp -> ft warm start, mixup, StableAdamW, LoRA and model souping are
  not applied (documented deviation). Validation-selected checkpoint, one
  final test per seed, seeds 42-46, population std. Published reference pr_auc
  0.7470 +/- 0.0807 (delta -0.0791). See
  experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
