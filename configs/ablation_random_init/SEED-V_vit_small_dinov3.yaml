dataset: SEED-V
source: configs/backbones/vit_small_dinov3/SEED-V.yaml
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 1}
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 50
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 5
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.25651, std: 0.00293}
  kappa: {mean: 0.07203, std: 0.00385}
  f1: {mean: 0.26430, std: 0.00294}
notes: >-
  Matched-initialization control for configs/backbones/vit_small_dinov3/SEED-V.yaml: identical recipe with
  use_pretrained_weights=false. Rerun (v2) with the current code (LMDB fork-safety fix,
  cls_token aggregation) and the profile aligned to early_stop 10 / num_workers 0.
  Five seeds 42--46, validation-selected checkpoint, one final test per seed.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/vit_small_dinov3_seed_v_random_init_v2/{seed}
  log_root: experiments/logs/pretrain_vs_random/vit_small_dinov3_seed_v_random_init_v2/{seed}
