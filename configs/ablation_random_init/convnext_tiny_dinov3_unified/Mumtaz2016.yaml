dataset: Mumtaz2016
source: configs/backbones/convnext_tiny_dinov3_unified/Mumtaz2016.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: flatten
  head_init_std: 0.002
  squeeze_binary: true
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 30, ba: 0.90491, pr_auc: 0.96836, roc_auc: 0.96192}
    43: {epoch: 8, ba: 0.89893, pr_auc: 0.95865, roc_auc: 0.94657}
    44: {epoch: 11, ba: 0.89341, pr_auc: 0.96133, roc_auc: 0.95211}
    45: {epoch: 21, ba: 0.90083, pr_auc: 0.96564, roc_auc: 0.95799}
    46: {epoch: 13, ba: 0.89932, pr_auc: 0.97201, roc_auc: 0.96774}
  mean: {ba: 0.89948, pr_auc: 0.96520, roc_auc: 0.95727}
  std_population: {ba: 0.00370, pr_auc: 0.00478, roc_auc: 0.00739}
notes: >-
  Matched-initialization control for configs/backbones/convnext_tiny_dinov3_unified/Mumtaz2016.yaml.yaml:
  the recipe is identical (only use_pretrained_weights=false differs). Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed; std is the population
  standard deviation. Primary metric delta (pretrained minus random): +1.37 pp.
  Per-seed values re-recorded from the w4 reproduction queue (2026-09-21).
output:
  model_root: experiments/checkpoints/pretrain_vs_random/convnext_tiny_dinov3_unified_mumtaz2016_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/convnext_tiny_dinov3_unified_mumtaz2016_random_init/{seed}
