dataset: ISRUC
backbone_name: efficientnet_b0
training:
  lr: 0.001
  batch_size: 16
  epochs: 15
  weight_decay: 0.005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 15
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
vision:
  adapter:
    fold_factor: 12
  head_init_std: 0.002
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.79886, std: 0.00297}
  kappa: {mean: 0.77328, std: 0.00378}
  f1: {mean: 0.82428, std: 0.00288}
notes: >-
  Pretrain-vs-random ablation. Identical to the locked ISRUC recipe except
  use_pretrained_weights=false (random backbone initialization). Fold factor
  P=12 and head_init_std=0.002 come from the locked dataset recipe.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/ISRUC_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/ISRUC_random_init/{seed}
