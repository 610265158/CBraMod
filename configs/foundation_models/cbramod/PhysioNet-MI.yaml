dataset: PhysioNet-MI
model_arch: cbramod
training:
  lr: 0.0001
  batch_size: 32
  epochs: 30
  weight_decay: 0.005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.62417
    std: 0.00797
  kappa:
    mean: 0.4988
    std: 0.01064
  f1:
    mean: 0.62316
    std: 0.00786
  per_seed:
    42:
      epoch: 5
      ba: 0.6246
      kappa: 0.49939
      f1: 0.62398
    43:
      epoch: 4
      ba: 0.61907
      kappa: 0.492
      f1: 0.61691
    44:
      epoch: 4
      ba: 0.6379
      kappa: 0.51713
      f1: 0.6365
    45:
      epoch: 5
      ba: 0.6252
      kappa: 0.50014
      f1: 0.62466
    46:
      epoch: 5
      ba: 0.61409
      kappa: 0.48534
      f1: 0.61373
notes: >-
  Matched-pipeline CBraMod rerun on PhysioNet-MI (64-channel, four-class motor
  imagery). The per-dataset recipe from configs/downstream.py is used unchanged;
  the only adapted hyperparameter is the learning rate (1e-4). The loader
  normalizes inputs with the released CBraMod convention (microvolt / 100, no
  clipping), configured by finetune_main from configs/foundation.py.
  Validation-selected checkpoint (validation kappa), one final test per seed,
  seeds 42-46, population std. Published reference kappa 0.5222 +/- 0.0169
  (delta -0.0234). See experiments/reports/foundation_rerun_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun/cbramod/seed{seed}
  log_root: experiments/logs/foundation_rerun/cbramod/seed{seed}
