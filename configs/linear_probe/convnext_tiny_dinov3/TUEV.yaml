dataset: TUEV
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter:
    fold_factor: 4
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 5
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
    42:
      ba: 0.55672
      kappa: 0.65873
      f1: 0.82239
    43:
      ba: 0.54423
      kappa: 0.66677
      f1: 0.82438
    44:
      ba: 0.5663
      kappa: 0.6635
      f1: 0.82389
    45:
      ba: 0.55661
      kappa: 0.67385
      f1: 0.82913
    46:
      ba: 0.54815
      kappa: 0.66352
      f1: 0.823
  mean:
    ba: 0.554402
    kappa: 0.665274
    f1: 0.824558
  std_population:
    ba: 0.007673
    kappa: 0.004997
    f1: 0.002388
notes: Five-seed (42--46) TUEV run with ConvNeXt-Tiny (v1) DINOv3 LVD-1689M self-supervised
  weights. TUEV canonical geometry (P=4, 16x1000 -> 64x250 -> 64x256), 6-way multiclass
  kappa selection, one final test evaluation per seed. lr=1e-4 because the ConvNeXt
  family is unstable at the EfficientNet TUEV lr=1e-3. Population standard deviations.
output:
  model_root: experiments/checkpoints/tuev_convnext_tiny_dinov3_p4_5seed_v1/seed{seed}
  log_root: experiments/logs/tuev_convnext_tiny_dinov3_p4_5seed_v1/seed{seed}
reshape_control:
  fold_mode: chunk
  source: configs/ablation_fold_geometry/convnext_tiny_dinov3/tuev_chunk.yaml
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  mean:
    ba: 0.63116
    kappa: 0.67211
    f1: 0.8259
  std_population:
    ba: 0.05243
    kappa: 0.01671
    f1: 0.01206
  delta_vs_fold:
    ba: -0.04513
    kappa: -0.03735
    f1: -0.0229
