dataset: CHB-MIT
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  init_head: false
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.005
  min_lr: 0.000001
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: true
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 10.0
  mirror_augmentation: false
  time_roll_augmentation: false
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.72999, std: 0.04529}
  pr_auc: {mean: 0.40368, std: 0.02243}
  roc_auc: {mean: 0.88818, std: 0.02200}
results:
  ba: {mean: 0.72999, std: 0.04529}
  pr_auc: {mean: 0.40368, std: 0.02243}
  roc_auc: {mean: 0.88818, std: 0.02200}
notes: >-
  Pretrain-vs-random ablation: efficientnet_b0 architecture with random initialization
  (use_pretrained_weights=false). Matches the CHB-MIT pretrained recipe; only
  the initialization differs.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/CHB-MIT_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/CHB-MIT_random_init/{seed}
