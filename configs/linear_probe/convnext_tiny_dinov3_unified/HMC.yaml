dataset: HMC
source: configs/backbones/convnext_tiny_dinov3_unified/HMC.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 16}
  feature_aggregation: gap
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Frozen linear probe for configs/backbones/convnext_tiny_dinov3_unified/HMC.yaml.yaml: identical recipe
  with frozen=true, so only the classifier head is updated. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed.
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 23, ba: 0.62301, kappa: 0.57062, f1: 0.66267}
    43: {epoch: 27, ba: 0.62224, kappa: 0.56986, f1: 0.66284}
    44: {epoch: 23, ba: 0.62347, kappa: 0.57026, f1: 0.66394}
    45: {epoch: 17, ba: 0.61949, kappa: 0.56722, f1: 0.66079}
    46: {epoch: 17, ba: 0.62266, kappa: 0.56983, f1: 0.66296}
  mean: {ba: 0.62217, kappa: 0.56956, f1: 0.66264}
  std_population: {ba: 0.00140, kappa: 0.00120, f1: 0.00103}
output:
  model_root: experiments/checkpoints/linear_probe/convnext_tiny_dinov3_unified/hmc/seed{seed}
  log_root: experiments/logs/linear_probe/convnext_tiny_dinov3_unified/hmc/seed{seed}
