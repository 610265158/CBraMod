dataset: SHU-MI
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 2
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 20
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
head_comparison:
  cls_token:
    status: complete
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.60375
      pr_auc: 0.66889
      roc_auc: 0.6515
    std_population:
      ba: 0.00707
      pr_auc: 0.00318
      roc_auc: 0.01181
  recommendation: cls_token
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/vit_small_dinov3/SHU-MI.yaml
  otherwise. Compare against the phase-interleaved fold baseline PR-AUC 0.66185 recorded
  there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/shu_mi/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/shu_mi/seed{seed}
