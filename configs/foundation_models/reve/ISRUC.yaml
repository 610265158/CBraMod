dataset: ISRUC
model_arch: reve
training:
  lr: 0.0001
  batch_size: 8
  epochs: 15
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.80124
    std: 0.00371
  kappa:
    mean: 0.77657
    std: 0.00463
  f1:
    mean: 0.8241
    std: 0.00406
  per_seed:
    42:
      epoch: 6
      ba: 0.80354
      kappa: 0.78106
      f1: 0.82817
    43:
      epoch: 7
      ba: 0.80199
      kappa: 0.77851
      f1: 0.82554
    44:
      epoch: 6
      ba: 0.79431
      kappa: 0.7685
      f1: 0.81694
    45:
      epoch: 7
      ba: 0.80125
      kappa: 0.77447
      f1: 0.82253
    46:
      epoch: 6
      ba: 0.8051
      kappa: 0.78029
      f1: 0.8273
notes: >-
  Foundation rerun v2 record for REVE-Base on ISRUC (5-class sleep staging).
  Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at factor 0.1, EMA
  0.995, weight decay 5e-4, gradient clipping 1.0, early stop 10) with 15
  epochs and kappa checkpoint selection from configs/downstream.py; the loader
  applies the released REVE scale_factor (microvolt / 10, no clipping) and
  supplies released electrode positions (6 channels). The released lp -> ft
  warm start, mixup, StableAdamW, LoRA and model souping are not applied
  (documented deviation). Validation-selected checkpoint, one final test per
  seed, seeds 42-46, population std. REVE ISRUC runs at batch 8 instead of the
  configured batch size 16 because the 22-layer encoder exceeds the GPU memory
  at batch 16 (CUDA OOM); this is the only batch-size deviation in the sweep.
  Published reference kappa 0.7500 +/- 0.0156 (delta +0.0266). See
  experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
