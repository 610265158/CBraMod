dataset: FACED
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 50
  weight_decay: 0.005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.48497
    std: 0.00617
  kappa:
    mean: 0.41898
    std: 0.00626
  f1:
    mean: 0.48549
    std: 0.00699
  per_seed:
    42:
      epoch: 7
      ba: 0.49302
      kappa: 0.42587
      f1: 0.48916
    43:
      epoch: 12
      ba: 0.48564
      kappa: 0.42025
      f1: 0.48693
    44:
      epoch: 36
      ba: 0.47598
      kappa: 0.41036
      f1: 0.47894
    45:
      epoch: 12
      ba: 0.4898
      kappa: 0.42524
      f1: 0.49581
    46:
      epoch: 24
      ba: 0.48041
      kappa: 0.41319
      f1: 0.47659
notes: >-
  Matched-pipeline REVE-Base rerun on FACED. The per-dataset recipe from
  configs/downstream.py is used unchanged; the only adapted hyperparameter is
  the learning rate (1e-4). The loader normalizes inputs with the released
  REVE scale_factor (microvolt / 1000, no clipping) and supplies released
  electrode positions (32 channels), configured by finetune_main from
  configs/foundation.py. The REVE paper's lp -> ft warm start, mixup,
  StableAdamW, LoRA and model souping are not applied (documented deviation).
  Validation-selected checkpoint, one final test per seed, seeds 42-46,
  population std. Published reference kappa 0.5080 +/- 0.0191 (delta -0.0890;
  no interval overlap). See experiments/reports/foundation_rerun_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun/reve/seed{seed}
