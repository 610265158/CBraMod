dataset: TUEV
model_arch: cbramod
training:
  lr: 0.0001
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.50304
    std: 0.01784
  kappa:
    mean: 0.56938
    std: 0.02171
  f1:
    mean: 0.77446
    std: 0.01073
  per_seed:
    42:
      epoch: 1
      ba: 0.53138
      kappa: 0.60921
      f1: 0.79426
    43:
      epoch: 1
      ba: 0.48536
      kappa: 0.54477
      f1: 0.76231
    44:
      epoch: 1
      ba: 0.51583
      kappa: 0.57192
      f1: 0.77492
    45:
      epoch: 1
      ba: 0.49565
      kappa: 0.56025
      f1: 0.76932
    46:
      epoch: 1
      ba: 0.48697
      kappa: 0.56074
      f1: 0.77148
notes: >-
  Foundation rerun v2 record for CBraMod on TUEV (6-class event type
  classification). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at
  factor 0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop
  10) with 10 epochs and kappa checkpoint selection from
  configs/downstream.py; the loader applies the released CBraMod normalization
  (microvolt / 100, no clipping). The released multi-LR schedule is not used;
  the whole network trains with a single 1e-4 learning rate (documented
  deviation). Validation-selected checkpoint, one final test per seed, seeds
  42-46, population std. TUEV validation kappa peaks at the first epoch for
  every seed (the validation split is about 89% majority class), so all
  selected checkpoints are epoch 1. Published reference kappa 0.6744 +/-
  0.0121 (delta -0.1050). See
  experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/cbramod/seed{seed}
