dataset: TUEV
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 4
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: cls_token
  lr: 0.0005
  clip_value: 1.0
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  mean:
    ba: 0.72607
    kappa: 0.74276
    f1: 0.8655
  std_population:
    ba: 0.01353
    kappa: 0.01266
    f1: 0.00548
head_comparison:
  flatten:
    status: complete
    feature_aggregation: flatten
    lr: 0.0001
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.7217
      kappa: 0.72625
      f1: 0.85629
    std_population:
      ba: 0.00621
      kappa: 0.00426
      f1: 0.00293
  recommendation: cls_token
notes: True CLS-token head at lr 5e-4 with clip 1, replacing the flatten head (+1.65pp
  kappa, raw p=.057). The previously pending patch-mean comparison is superseded by
  the corrected CLS-token semantics. Five seeds, validation-selected checkpoint, one
  final test per seed.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_tuev_p4_clstoken_lr5e4_clip1_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_tuev_p4_clstoken_lr5e4_clip1_5seed_v1/seed{seed}
reshape_control:
  fold_mode: chunk
  source: configs/ablation_fold_geometry/vit_small_dinov3/tuev_chunk.yaml
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  mean:
    ba: 0.67267
    kappa: 0.69698
    f1: 0.84142
  std_population:
    ba: 0.0056
    kappa: 0.0074
    f1: 0.00393
  delta_vs_fold:
    ba: -0.0534
    kappa: -0.04578
