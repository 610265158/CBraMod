dataset: ISRUC
source: configs/backbones/convnext_tiny_dinov3_unified/ISRUC.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 12}
  feature_aggregation: gap
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 16
  epochs: 15
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 15, ba: 0.70676, kappa: 0.67340, f1: 0.73637}
    43: {epoch: 15, ba: 0.69650, kappa: 0.65751, f1: 0.72353}
    44: {epoch: 15, ba: 0.70660, kappa: 0.67316, f1: 0.73705}
    45: {epoch: 15, ba: 0.64947, kappa: 0.60608, f1: 0.68039}
    46: {epoch: 15, ba: 0.68685, kappa: 0.65403, f1: 0.72132}
  mean: {ba: 0.68924, kappa: 0.65284, f1: 0.71973}
  std_population: {ba: 0.02121, kappa: 0.02468, f1: 0.02070}
notes: >-
  Matched-initialization control for configs/backbones/convnext_tiny_dinov3_unified/ISRUC.yaml.yaml:
  the recipe is identical (only use_pretrained_weights=false differs). Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed; std is the population
  standard deviation. Primary metric delta (pretrained minus random): +13.36 pp.
  Per-seed values re-recorded from the w4 reproduction queue (2026-09-21).
output:
  model_root: experiments/checkpoints/pretrain_vs_random/convnext_tiny_dinov3_unified_isruc_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/convnext_tiny_dinov3_unified_isruc_random_init/{seed}
