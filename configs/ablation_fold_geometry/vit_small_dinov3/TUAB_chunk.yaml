dataset: TUAB
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 4
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) on the
  updated CLS-token ViT recipe. Identical to configs/backbones/vit_small_dinov3/TUAB.yaml
  otherwise (cls_token aggregation, lr 5e-4, clip 1). Compare against the phase-interleaved
  fold baseline recorded there: {''ba'': 0.82019, ''pr_auc'': 0.90907, ''roc_auc'':
  0.90424}.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/tuab/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/tuab/seed{seed}
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.81531
      pr_auc: 0.89975
      roc_auc: 0.89527
    43:
      ba: 0.81604
      pr_auc: 0.90132
      roc_auc: 0.89572
    44:
      ba: 0.81313
      pr_auc: 0.89934
      roc_auc: 0.8957
    45:
      ba: 0.81393
      pr_auc: 0.90043
      roc_auc: 0.89703
    46:
      ba: 0.80964
      pr_auc: 0.89634
      roc_auc: 0.89383
  mean:
    ba: 0.81361
    pr_auc: 0.89944
    roc_auc: 0.89551
  std_population:
    ba: 0.00223
    pr_auc: 0.00169
    roc_auc: 0.00103
  fold_baseline:
    protocol: validation_selected_checkpoint_once_on_test
    feature_aggregation: cls_token
    lr: 0.0005
    clip_value: 1.0
    augmentation:
    - mirror
    - time_roll
    - amplitude_scale
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.82019
      pr_auc: 0.90907
      roc_auc: 0.90424
    std_population:
      ba: 0.00306
      pr_auc: 0.00336
      roc_auc: 0.00245
