dataset: BCIC2020-3
source: configs/backbones/convnext_tiny_dinov3_unified/BCIC2020-3.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 1}
  feature_aggregation: flatten
  head_init_std: 0.002
training:
  lr: 1.0e-05
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 70
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Frozen linear probe for configs/backbones/convnext_tiny_dinov3_unified/BCIC2020-3.yaml.yaml: identical recipe
  with frozen=true, so only the classifier head is updated. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed.
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 31, ba: 0.23200, kappa: 0.04000, f1: 0.22956}
    43: {epoch: 49, ba: 0.23600, kappa: 0.04500, f1: 0.23165}
    44: {epoch: 24, ba: 0.22400, kappa: 0.03000, f1: 0.22076}
    45: {epoch: 12, ba: 0.22933, kappa: 0.03667, f1: 0.22736}
    46: {epoch: 7, ba: 0.22133, kappa: 0.02667, f1: 0.21994}
  mean: {ba: 0.22853, kappa: 0.03567, f1: 0.22585}
  std_population: {ba: 0.00531, kappa: 0.00663, f1: 0.00470}
output:
  model_root: experiments/checkpoints/linear_probe/convnext_tiny_dinov3_unified/bcic2020_3/seed{seed}
  log_root: experiments/logs/linear_probe/convnext_tiny_dinov3_unified/bcic2020_3/seed{seed}
