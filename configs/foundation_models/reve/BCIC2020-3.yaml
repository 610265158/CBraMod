dataset: BCIC2020-3
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.58667
    std: 0.09699
  kappa:
    mean: 0.48333
    std: 0.12124
  f1:
    mean: 0.58657
    std: 0.0969
  per_seed:
    42:
      epoch: 29
      ba: 0.624
      kappa: 0.53
      f1: 0.62394
    43:
      epoch: 30
      ba: 0.39467
      kappa: 0.24333
      f1: 0.3947
    44:
      epoch: 25
      ba: 0.66133
      kappa: 0.57667
      f1: 0.6609
    45:
      epoch: 27
      ba: 0.628
      kappa: 0.535
      f1: 0.62784
    46:
      epoch: 23
      ba: 0.62533
      kappa: 0.53167
      f1: 0.62547
notes: >-
  Foundation rerun v2 record for REVE-Base on BCIC2020-3 (5-class imagined
  speech). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at factor
  0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop 10)
  with 30 epochs and kappa checkpoint selection from configs/downstream.py;
  the loader applies the released REVE scale_factor (microvolt / 1000, no
  clipping) and supplies released electrode positions (64 channels). The
  released lp -> ft warm start, mixup, StableAdamW, LoRA and model souping are
  not applied (documented deviation). Validation-selected checkpoint, one
  final test per seed, seeds 42-46, population std. The released Speech config
  selects the pooled-token (last) readout, but on the stored arrays that
  readout stays at chance under the campaign recipe (five-seed kappa 0.107);
  this record uses the non-pooling readout instead (flatten all patch tokens
  together with the context token), which the released REVE paper also uses
  for its probe columns. Published reference kappa 0.4543 +/- 0.0154 (delta
  +0.0290). See experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1_bcic_poolno_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1_bcic_poolno_v1/reve/seed{seed}
