dataset: MentalArithmetic
source: configs/backbones/convnext_tiny_dinov3_unified/MentalArithmetic.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: flatten
  head_init_std: 0.002
  squeeze_binary: true
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Frozen linear probe for configs/backbones/convnext_tiny_dinov3_unified/MentalArithmetic.yaml.yaml: identical recipe
  with frozen=true, so only the classifier head is updated. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed.
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 50, ba: 0.77083, pr_auc: 0.70844, roc_auc: 0.81858}
    43: {epoch: 50, ba: 0.77431, pr_auc: 0.71323, roc_auc: 0.82031}
    44: {epoch: 48, ba: 0.74653, pr_auc: 0.70852, roc_auc: 0.82538}
    45: {epoch: 2, ba: 0.50694, pr_auc: 0.32043, roc_auc: 0.59578}
    46: {epoch: 50, ba: 0.73958, pr_auc: 0.70937, roc_auc: 0.82292}
  mean: {ba: 0.70764, pr_auc: 0.63200, roc_auc: 0.77659}
  std_population: {ba: 0.10124, pr_auc: 0.15579, roc_auc: 0.09044}
output:
  model_root: experiments/checkpoints/linear_probe/convnext_tiny_dinov3_unified/mentalarithmetic/seed{seed}
  log_root: experiments/logs/linear_probe/convnext_tiny_dinov3_unified/mentalarithmetic/seed{seed}
