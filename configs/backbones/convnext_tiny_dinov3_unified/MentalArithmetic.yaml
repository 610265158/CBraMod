dataset: MentalArithmetic
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 4}
  feature_aggregation: flatten
  head_init_std: 0.002
  squeeze_binary: true
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Unified ConvNeXt-Tiny DINOv3 recipe: lr 1e-4, weight decay 5e-4, EMA 0.999
  (documented exception), grad-norm clip 1.0, warmup 3 epochs, early stop 10,
  dropout 0.1, head_init_std 0.002, flatten aggregation. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed,
  population standard deviation. EMA 0.999 is a documented per-dataset
  exception: the matched ten-seed comparison in
  configs/ablation_recipe/convnext_tiny_dinov3_unified/MentalArithmetic_ema999.yaml
  gives pr_auc 0.75828 +/- 0.03690 versus 0.72538 +/- 0.05865 at EMA 0.995
  (paired +0.03291, t=3.55, df=9, p~0.006; both seed halves agree). With the
  exception the dataset returns to its previous recorded level (0.75983 under
  the old per-dataset recipe, delta -0.005).
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 50, ba: 0.78125, pr_auc: 0.72333, roc_auc: 0.85446}
    43: {epoch: 50, ba: 0.71181, pr_auc: 0.72592, roc_auc: 0.83348}
    44: {epoch: 50, ba: 0.76042, pr_auc: 0.77428, roc_auc: 0.89135}
    45: {epoch: 50, ba: 0.76736, pr_auc: 0.77095, roc_auc: 0.88122}
    46: {epoch: 50, ba: 0.77083, pr_auc: 0.78114, roc_auc: 0.87196}
  mean: {ba: 0.75833, pr_auc: 0.75512, roc_auc: 0.86649}
  std_population: {ba: 0.02421, pr_auc: 0.02513, roc_auc: 0.02049}
output:
  model_root: experiments/checkpoints/mentalarithmetic_convnext_tiny_dinov3_p4_flatten_lr1e4_wd5e4_ema999_clip1_warm3_5seed_v1/seed{seed}
  log_root: experiments/logs/mentalarithmetic_convnext_tiny_dinov3_p4_flatten_lr1e4_wd5e4_ema999_clip1_warm3_5seed_v1/seed{seed}
