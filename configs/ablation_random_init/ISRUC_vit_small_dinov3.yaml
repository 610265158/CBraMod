dataset: ISRUC
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 12}
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 16
  epochs: 15
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 15
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.76746, std: 0.00357}
  kappa: {mean: 0.73729, std: 0.00407}
  f1: {mean: 0.79550, std: 0.00338}
notes: >-
  Pretrain-vs-random ablation: ViT-Small DINOv3 architecture with random
  initialization (use_pretrained_weights=false). Matches the corrected DINOv3
  pretrained ISRUC recipe (true cls-token head, lr 5e-4, clip 1); only the
  initialization differs.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/vit_small_dinov3_ISRUC_random_init_clstoken_lr5e4_clip1/{seed}
  log_root: experiments/logs/pretrain_vs_random/vit_small_dinov3_ISRUC_random_init_clstoken_lr5e4_clip1/{seed}
