dataset: SHU-MI
source: configs/backbones/efficientnet_b0/SHU-MI.yaml
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter:
    fold_factor: 2
  squeeze_binary: true
training:
  lr: 0.001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.50050, std: 0.00042}
  pr_auc: {mean: 0.51572, std: 0.01750}
  roc_auc: {mean: 0.51742, std: 0.02014}
notes: >-
  Matched-initialization control for configs/backbones/efficientnet_b0/SHU-MI.yaml: identical recipe with
  use_pretrained_weights=false. Rerun (v2) with the current code (LMDB fork-safety fix,
  cls_token aggregation) and the profile aligned to early_stop 10 / num_workers 0.
  Five seeds 42--46, validation-selected checkpoint, one final test per seed.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/efficientnet_b0_shu_mi_random_init_v2/{seed}
  log_root: experiments/logs/pretrain_vs_random/efficientnet_b0_shu_mi_random_init_v2/{seed}
reshape_control:
  fold_mode: chunk
  source: configs/ablation_fold_geometry/efficientnet_b0/shu_mi_chunk.yaml
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  mean:
    ba: 0.63134
    pr_auc: 0.70094
    roc_auc: 0.69459
  std_population:
    ba: 0.00458
    pr_auc: 0.01382
    roc_auc: 0.0144
  delta_vs_fold:
    ba: 0.004
    pr_auc: 0.00275
    roc_auc: -0.00163
