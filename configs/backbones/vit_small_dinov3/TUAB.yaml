dataset: TUAB
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  feature_aggregation: gap
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: gap
  lr: 0.0005
  augmentation: [mirror, time_roll, amplitude_scale]
  seeds: [42, 43, 44, 45, 46]
  mean: {ba: 0.82262, pr_auc: 0.91141, roc_auc: 0.90658}
  std_population: {ba: 0.00073, pr_auc: 0.00188, roc_auc: 0.00138}
head_comparison:
  flatten:
    status: complete
    feature_aggregation: flatten
    seeds: [42, 43, 44, 45, 46]
    mean: {ba: 0.80491, pr_auc: 0.88428, roc_auc: 0.87591}
    std_population: {ba: 0.00409, pr_auc: 0.00397, roc_auc: 0.00522}
    note: >-
      flatten head (51072-dim FC) overfits; val peaks at epoch 1 then
      declines. Superseded by the gap head.
  recommendation: gap
notes: >-
  ViT-Small DINOv3 TUAB with cls_token (gap) head, lr 5e-4, and train-time
  augmentation (channel mirror, time roll, amplitude scale). The gap head plus
  higher lr fix the flatten-head overfitting (val-test gap shrinks from ~0.024
  to ~0.007); augmentation further shrinks it to ~0.002. Final pr_auc 0.91141
  is on par with ConvNeXt-Tiny and above EfficientNet-B0.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_tuab_p4_gap_lr5e4_aug_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_tuab_p4_gap_lr5e4_aug_5seed_v1/seed{seed}
