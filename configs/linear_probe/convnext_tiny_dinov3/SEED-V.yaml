dataset: SEED-V
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter:
    fold_factor: 1
  feature_aggregation: flatten
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 50
  weight_decay: 0.005
  min_lr: 1.0e-06
  warmup_epochs: 5
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
    42:
      ba: 0.28504
      kappa: 0.10604
      f1: 0.29232
    43:
      ba: 0.27532
      kappa: 0.0936
      f1: 0.27825
    44:
      ba: 0.28371
      kappa: 0.10447
      f1: 0.28981
    45:
      ba: 0.28278
      kappa: 0.10295
      f1: 0.28908
    46:
      ba: 0.2851
      kappa: 0.10656
      f1: 0.29309
  mean:
    ba: 0.28239
    kappa: 0.102724
    f1: 0.28851
  std_population:
    ba: 0.00364
    kappa: 0.004734
    f1: 0.005344
notes: Five-seed (42--46) SEED-V run with ConvNeXt-Tiny (v1) DINOv3 LVD-1689M self-supervised
  weights. SEED-V geometry (P=1, 62x200 -> 64x224), 5-way emotion classification kappa
  selection, flatten feature aggregation, classifier-head initialization std 0.002,
  one final test evaluation per seed. lr=1e-4, warmup 5, EMA 0.995, and no train-time
  augmentation.
output:
  model_root: experiments/checkpoints/seedv_convnext_tiny_dinov3_p1_flatten_5seed_v1/seed{seed}
  log_root: experiments/logs/seedv_convnext_tiny_dinov3_p1_flatten_5seed_v1/seed{seed}
