dataset: CHB-MIT
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 4
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: true
  balanced_sampling_power: 1.0
  balanced_sampling_negative_ratio: 10.0
  mirror_augmentation: false
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) on the
  updated CLS-token ViT recipe. Identical to configs/backbones/vit_small_dinov3/CHB-MIT.yaml
  otherwise (cls_token aggregation, lr 5e-4, clip 1). Compare against the phase-interleaved
  fold baseline recorded there: {''ba'': 0.72044, ''pr_auc'': 0.47587, ''roc_auc'':
  0.91161}.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/chb_mit/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/chb_mit/seed{seed}
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.74553
      pr_auc: 0.48964
      roc_auc: 0.92954
    43:
      ba: 0.77893
      pr_auc: 0.51694
      roc_auc: 0.93303
    44:
      ba: 0.76336
      pr_auc: 0.48406
      roc_auc: 0.9202
    45:
      ba: 0.75163
      pr_auc: 0.48616
      roc_auc: 0.92923
    46:
      ba: 0.76736
      pr_auc: 0.50233
      roc_auc: 0.91886
  mean:
    ba: 0.76136
    pr_auc: 0.49583
    roc_auc: 0.92617
  std_population:
    ba: 0.01178
    pr_auc: 0.01231
    roc_auc: 0.0056
  fold_baseline:
    protocol: validation_selected_checkpoint_once_on_test
    feature_aggregation: cls_token
    lr: 0.0005
    clip_value: 1.0
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.72044
      pr_auc: 0.47587
      roc_auc: 0.91161
    std_population:
      ba: 0.01751
      pr_auc: 0.0118
      roc_auc: 0.0071
