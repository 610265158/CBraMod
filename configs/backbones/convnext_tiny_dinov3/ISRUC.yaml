dataset: ISRUC
model_arch: vision
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 12}
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 16
  epochs: 15
  weight_decay: 0.005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 15
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: kappa
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.81415, std: 0.00087}
  kappa: {mean: 0.79055, std: 0.00176}
  f1: {mean: 0.83715, std: 0.00124}
notes: >-
  Five-seed (42--46) ISRUC run with ConvNeXt-Tiny (v1) DINOv3 LVD-1689M
  self-supervised weights. ISRUC canonical geometry (P=12, 20x6x6000 ->
  [B*20,1,72,500] -> [B*20,1,96,512]), 5-way sleep staging kappa selection, one
  final test evaluation per seed. lr=1e-4 because the ConvNeXt family is
  unstable at the EfficientNet ISRUC lr=1e-3; the rest of the schedule
  (warmup 3, ema 0.995, mirror/time-roll augmentation, head_init_std 0.002)
  follows the locked ISRUC recipe. Population standard deviations.
output:
  model_root: experiments/checkpoints/isruc_convnext_tiny_dinov3_p12_5seed_v1/seed{seed}
  log_root: experiments/logs/isruc_convnext_tiny_dinov3_p12_5seed_v1/seed{seed}
