dataset: Mumtaz2016
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.92532
    std: 0.01524
  pr_auc:
    mean: 0.99119
    std: 0.00562
  roc_auc:
    mean: 0.99021
    std: 0.00645
  per_seed:
    42:
      epoch: 3
      ba: 0.95153
      pr_auc: 0.99722
      roc_auc: 0.9971
    43:
      epoch: 3
      ba: 0.93317
      pr_auc: 0.99468
      roc_auc: 0.99455
    44:
      epoch: 17
      ba: 0.91243
      pr_auc: 0.98393
      roc_auc: 0.98235
    45:
      epoch: 3
      ba: 0.91141
      pr_auc: 0.98486
      roc_auc: 0.98243
    46:
      epoch: 2
      ba: 0.91806
      pr_auc: 0.99527
      roc_auc: 0.99463
notes: >-
  Foundation rerun v2 record for REVE-Base on Mumtaz2016 (binary MDD
  detection). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at
  factor 0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop
  10) with 30 epochs and pr_auc checkpoint selection from
  configs/downstream.py; the loader applies the released REVE scale_factor
  (microvolt / 100, no clipping) and supplies released electrode positions (19
  channels). The released lp -> ft warm start, mixup, StableAdamW, LoRA and
  model souping are not applied (documented deviation). Validation-selected
  checkpoint, one final test per seed, seeds 42-46, population std. Published
  reference pr_auc 0.9961 +/- 0.0013 (delta -0.0049). Replaces the v1
  matched-pipeline record (pr_auc 0.9903 +/- 0.0037). See
  experiments/reports/foundation_rerun_v2_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
