dataset: TUEV
backbone_name: efficientnet_b0
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.0
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/efficientnet_b0/TUEV.yaml
  otherwise. Compare against the phase-interleaved fold baseline kappa 0.69009 +/-
  0.01896 recorded there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/efficientnet_b0/tuev/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/efficientnet_b0/tuev/seed{seed}
vision:
  adapter:
    fold_mode: chunk
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.59556
      kappa: 0.63755
      f1: 0.81738
    43:
      ba: 0.54059
      kappa: 0.67568
      f1: 0.8185
    44:
      ba: 0.55608
      kappa: 0.61748
      f1: 0.80284
    45:
      ba: 0.59067
      kappa: 0.6457
      f1: 0.81988
    46:
      ba: 0.63007
      kappa: 0.67807
      f1: 0.82944
  mean:
    ba: 0.58259
    kappa: 0.6509
    f1: 0.81761
  std_population:
    ba: 0.03148
    kappa: 0.02313
    f1: 0.00853
  fold_baseline:
    ba:
      mean: 0.64233
      std: 0.01636
    kappa:
      mean: 0.69009
      std: 0.01896
    f1:
      mean: 0.83797
      std: 0.0076
