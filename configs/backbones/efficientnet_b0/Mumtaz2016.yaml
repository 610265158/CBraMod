dataset: Mumtaz2016
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  feature_aggregation: gap
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.0
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.0
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: gap
  per_seed:
    42: {epoch: 21, ba: 0.91308, pr_auc: 0.98778, roc_auc: 0.98597}
    43: {epoch: 22, ba: 0.90472, pr_auc: 0.97781, roc_auc: 0.97451}
    44: {epoch: 28, ba: 0.91983, pr_auc: 0.99013, roc_auc: 0.98967}
    45: {epoch: 23, ba: 0.91641, pr_auc: 0.98954, roc_auc: 0.98792}
    46: {epoch: 20, ba: 0.92232, pr_auc: 0.98660, roc_auc: 0.98487}
  mean: {ba: 0.91527, pr_auc: 0.98637, roc_auc: 0.98459}
  std_population: {ba: 0.00613, pr_auc: 0.00446, roc_auc: 0.00530}
notes: >-
  Formal five-seed Mumtaz2016 amplitude-scale run. EfficientNet-B0 with P=4,
  no EMA, no time-roll/mirror/mixup augmentation, no label smoothing, and no
  dropout. Only log-uniform amplitude scaling in [0.5, 2.0] is enabled.
  Each seed selects one checkpoint on validation and evaluates test once.
output:
  model_root: experiments/checkpoints/mumtaz2016_efficientnet_b0_p4_simple_amp_scale_5seed/seed{seed}
  log_root: experiments/logs/mumtaz2016_efficientnet_b0_p4_simple_amp_scale_5seed/seed{seed}
