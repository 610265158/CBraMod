dataset: TUAB
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter:
    fold_factor: 4
    fold_mode: chunk
  squeeze_binary: true
  feature_aggregation: gap
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
head_comparison:
  flatten:
    status: complete
    feature_aggregation: flatten
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    mean:
      ba: 0.80491
      pr_auc: 0.88428
      roc_auc: 0.87591
    std_population:
      ba: 0.00409
      pr_auc: 0.00397
      roc_auc: 0.00522
    note: flatten head (51072-dim FC) overfits; val peaks at epoch 1 then declines.
      Superseded by the gap head.
  recommendation: gap
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/vit_small_dinov3/TUAB.yaml
  otherwise. Compare against the phase-interleaved fold baseline PR-AUC 0.91141 recorded
  there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/vit_small_dinov3/tuab/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/vit_small_dinov3/tuab/seed{seed}
