dataset: TUAB
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter:
    fold_factor: 4
    fold_mode: chunk
  squeeze_binary: true
  init_head: true
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: true
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: 'Fold-vs-reshape control: contiguous-chunk reshape (fold_mode=chunk) instead
  of phase-interleaved folding. Identical to configs/backbones/efficientnet_b0/TUAB.yaml
  otherwise. Compare against the phase-interleaved fold baseline (see source config
  results) recorded there.'
output:
  model_root: experiments/checkpoints/ablation_fold_geometry/efficientnet_b0/tuab/seed{seed}
  log_root: experiments/logs/ablation_fold_geometry/efficientnet_b0/tuab/seed{seed}
results:
  fold_mode: chunk
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  per_seed:
    42:
      ba: 0.81792
      pr_auc: 0.90265
      roc_auc: 0.89611
    43:
      ba: 0.81705
      pr_auc: 0.90238
      roc_auc: 0.89646
    44:
      ba: 0.81677
      pr_auc: 0.90063
      roc_auc: 0.89407
    45:
      ba: 0.82024
      pr_auc: 0.90506
      roc_auc: 0.89841
    46:
      ba: 0.81763
      pr_auc: 0.90467
      roc_auc: 0.89693
  mean:
    ba: 0.81792
    pr_auc: 0.90308
    roc_auc: 0.8964
  std_population:
    ba: 0.00123
    pr_auc: 0.00162
    roc_auc: 0.0014
  fold_baseline:
    with_augmentation:
      ba:
        mean: 0.83168
        std: 0.00325
      pr_auc:
        mean: 0.9178
        std: 0.00245
      roc_auc:
        mean: 0.91256
        std: 0.00241
    no_augmentation:
      ba:
        mean: 0.81759
        std: 0.00812
      pr_auc:
        mean: 0.90132
        std: 0.00619
      roc_auc:
        mean: 0.89494
        std: 0.00609
