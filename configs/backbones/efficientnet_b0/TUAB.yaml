dataset: TUAB
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  init_head: true
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  TUAB five-seed rerun: RA4 EfficientNet-B0, phase-interleaved fold factor
  P=4, 10 epochs, EMA decay 0.995, classifier-head initialization std 0.002,
  and no train-time augmentation.
results:
  ba: {mean: 0.81839, std: 0.00602}
  pr_auc: {mean: 0.90627, std: 0.00164}
  roc_auc: {mean: 0.89840, std: 0.00106}
output:
  model_root: experiments/checkpoints/efficientnet_b0/tuab_ra4_p4_ep10_ema995_headstd002_v2/seed{seed}
  log_root: experiments/logs/efficientnet_b0/tuab_ra4_p4_ep10_ema995_headstd002_v2/seed{seed}
