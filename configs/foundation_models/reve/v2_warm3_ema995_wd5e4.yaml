dataset:
- FACED
- HMC
- Mumtaz2016
- PhysioNet-MI
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  warmup_epochs: 3
  warmup_start_factor: 0.1
  ema_decay: 0.995
  weight_decay: 0.0005
  clip_value: 1.0
  early_stop: 10
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Foundation rerun v2 recipe for REVE-Base. Versus the v1 matched pipeline the
  changes are warmup 3 epochs (start factor 0.1), EMA 0.995, weight decay
  5e-4, gradient clipping at 1.0 and early stop 10; the learning rate stays
  1e-4 and per-dataset epochs keep their configs/downstream.py values.
  Gradient clipping at 1.0 was added on 2026-09-18 before the full
  five-dataset, two-model sweep. The loader keeps the released REVE
  scale_factor and electrode positions, and the released lp -> ft warm start,
  mixup, StableAdamW, LoRA and souping remain unapplied as documented in the
  v1 records. Run with `bash experiments/run_downstream.sh --config <this
  file>`; seeds 42-46 come from the protocol section. TUAB additionally uses
  10 epochs and is covered by v2_warm3_ema995_wd5e4_tuab.yaml. Use
  --num_workers 0 for the LMDB-backed datasets (FACED, Mumtaz2016,
  PhysioNet-MI).
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
