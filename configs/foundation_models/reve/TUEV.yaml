dataset: TUEV
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.0
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.65872
    std: 0.02763
  kappa:
    mean: 0.67238
    std: 0.02155
  f1:
    mean: 0.83107
    std: 0.01116
  per_seed:
    42:
      epoch: 1
      ba: 0.62102
      kappa: 0.66203
      f1: 0.82451
    43:
      epoch: 3
      ba: 0.64152
      kappa: 0.64182
      f1: 0.81522
    44:
      epoch: 4
      ba: 0.70338
      kappa: 0.70368
      f1: 0.8475
    45:
      epoch: 2
      ba: 0.66903
      kappa: 0.68848
      f1: 0.83857
    46:
      epoch: 6
      ba: 0.65864
      kappa: 0.66591
      f1: 0.82955
notes: >-
  Foundation rerun v2 record for REVE-Base on TUEV (6-class event type
  classification). Recipe: the v2 unified recipe (lr 1e-4, warmup 3 epochs at
  factor 0.1, EMA 0.995, weight decay 5e-4, gradient clipping 1.0, early stop
  10) with 10 epochs and kappa checkpoint selection from
  configs/downstream.py; the loader applies the released REVE scale_factor
  (microvolt / 100, no clipping) and supplies released electrode positions (16
  channels). The released lp -> ft warm start, mixup, StableAdamW, LoRA and
  model souping are not applied (documented deviation). Validation-selected
  checkpoint, one final test per seed, seeds 42-46, population std. The TUEV
  loader keeps microvolt / 100, the stored-array equivalent of the released
  volt-scale memmap factor x1e4 already documented for TUAB. Published
  reference kappa 0.6783 +/- 0.0199 (delta -0.0059). See
  experiments/reports/foundation_rerun_v2_remaining_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun_v2_warm3_ema995_wd5e4_5seed_v1/reve/seed{seed}
