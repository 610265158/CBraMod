<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Phase-interleaved lossless temporal folding</title>
  <desc id="desc">For each EEG channel, samples are reshaped into width by phase and transposed. With T=16 and P=4, folded rows contain indices 0 4 8 12, 1 5 9 13, 2 6 10 14, and 3 7 11 15.</desc>
  <defs>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#152238}.panel{font:700 24px Arial,sans-serif;fill:#152238}
      .body{font:500 18px Arial,sans-serif;fill:#344054}.small{font:500 15px Arial,sans-serif;fill:#475467}
      .idx{font:700 16px Arial,sans-serif}.formula{font:italic 600 21px Georgia,serif;fill:#152238}
      .wave{fill:none;stroke:#344054;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff;stroke:#667085;stroke-width:2}.guide{stroke:#D0D5DD;stroke-width:1;stroke-dasharray:4 5}
    </style>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#27788A"/></marker>
    <marker id="back" markerWidth="11" markerHeight="11" refX="2" refY="5.5" orient="auto"><path d="M11 0L0 5.5L11 11Z" fill="#27788A"/></marker>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Phase-Interleaved Lossless Temporal Folding</text>
  <text x="800" y="78" text-anchor="middle" class="body">reshape (C, W, P) → transpose (C, P, W), where W = T/P</text>

  <!-- Panel A: raw waveform, cyclic phase colors -->
  <text x="345" y="126" text-anchor="middle" class="panel">A. Raw EEG channel</text>
  <text x="345" y="153" text-anchor="middle" class="small">T = 16, P = 4 example · color denotes t mod P</text>
  <rect x="62" y="182" width="566" height="226" rx="10" class="box"/>
  <line x1="90" y1="300" x2="600" y2="300" stroke="#98A2B3" stroke-width="1"/>
  <g class="guide">
    <line x1="100" y1="205" x2="100" y2="390"/><line x1="132" y1="205" x2="132" y2="390"/><line x1="164" y1="205" x2="164" y2="390"/><line x1="196" y1="205" x2="196" y2="390"/>
    <line x1="228" y1="205" x2="228" y2="390"/><line x1="260" y1="205" x2="260" y2="390"/><line x1="292" y1="205" x2="292" y2="390"/><line x1="324" y1="205" x2="324" y2="390"/>
    <line x1="356" y1="205" x2="356" y2="390"/><line x1="388" y1="205" x2="388" y2="390"/><line x1="420" y1="205" x2="420" y2="390"/><line x1="452" y1="205" x2="452" y2="390"/>
    <line x1="484" y1="205" x2="484" y2="390"/><line x1="516" y1="205" x2="516" y2="390"/><line x1="548" y1="205" x2="548" y2="390"/><line x1="580" y1="205" x2="580" y2="390"/>
  </g>
  <polyline class="wave" points="100,306 132,335 164,267 196,288 228,245 260,315 292,276 324,345 356,297 388,258 420,326 452,283 484,230 516,270 548,310 580,255"/>
  <g stroke="#fff" stroke-width="2">
    <circle cx="100" cy="306" r="7" fill="#2E77B5"/><circle cx="132" cy="335" r="7" fill="#D8752B"/><circle cx="164" cy="267" r="7" fill="#239B75"/><circle cx="196" cy="288" r="7" fill="#8558B5"/>
    <circle cx="228" cy="245" r="7" fill="#2E77B5"/><circle cx="260" cy="315" r="7" fill="#D8752B"/><circle cx="292" cy="276" r="7" fill="#239B75"/><circle cx="324" cy="345" r="7" fill="#8558B5"/>
    <circle cx="356" cy="297" r="7" fill="#2E77B5"/><circle cx="388" cy="258" r="7" fill="#D8752B"/><circle cx="420" cy="326" r="7" fill="#239B75"/><circle cx="452" cy="283" r="7" fill="#8558B5"/>
    <circle cx="484" cy="230" r="7" fill="#2E77B5"/><circle cx="516" cy="270" r="7" fill="#D8752B"/><circle cx="548" cy="310" r="7" fill="#239B75"/><circle cx="580" cy="255" r="7" fill="#8558B5"/>
  </g>
  <g text-anchor="middle" class="idx">
    <text x="100" y="218" fill="#2E77B5">0</text><text x="132" y="218" fill="#D8752B">1</text><text x="164" y="218" fill="#239B75">2</text><text x="196" y="218" fill="#8558B5">3</text>
    <text x="228" y="218" fill="#2E77B5">4</text><text x="260" y="218" fill="#D8752B">5</text><text x="292" y="218" fill="#239B75">6</text><text x="324" y="218" fill="#8558B5">7</text>
    <text x="356" y="218" fill="#2E77B5">8</text><text x="388" y="218" fill="#D8752B">9</text><text x="420" y="218" fill="#239B75">10</text><text x="452" y="218" fill="#8558B5">11</text>
    <text x="484" y="218" fill="#2E77B5">12</text><text x="516" y="218" fill="#D8752B">13</text><text x="548" y="218" fill="#239B75">14</text><text x="580" y="218" fill="#8558B5">15</text>
  </g>
  <text x="345" y="440" text-anchor="middle" class="formula">X[c, t],   t = 0,…,15</text>
  <text x="345" y="471" text-anchor="middle" class="small">The four phases are interleaved along the original time axis.</text>

  <!-- Panel B: exact index operation -->
  <text x="800" y="126" text-anchor="middle" class="panel">B. Reindex</text>
  <text x="800" y="153" text-anchor="middle" class="small">view (W, P), then transpose</text>
  <rect x="680" y="182" width="240" height="226" rx="10" fill="#F8FAFC" stroke="#667085" stroke-width="2"/>
  <text x="800" y="210" text-anchor="middle" class="small">reshape to (W, P)</text>
  <g text-anchor="middle" dominant-baseline="middle" class="idx">
    <g fill="#2E77B5"><text x="724" y="246">0</text><text x="724" y="282">4</text><text x="724" y="318">8</text><text x="724" y="354">12</text></g>
    <g fill="#D8752B"><text x="774" y="246">1</text><text x="774" y="282">5</text><text x="774" y="318">9</text><text x="774" y="354">13</text></g>
    <g fill="#239B75"><text x="824" y="246">2</text><text x="824" y="282">6</text><text x="824" y="318">10</text><text x="824" y="354">14</text></g>
    <g fill="#8558B5"><text x="874" y="246">3</text><text x="874" y="282">7</text><text x="874" y="318">11</text><text x="874" y="354">15</text></g>
  </g>
  <g stroke="#CBD5E1" stroke-width="1">
    <path d="M699 228H899M699 264H899M699 300H899M699 336H899M699 372H899"/>
    <path d="M699 228V372M749 228V372M799 228V372M849 228V372M899 228V372"/>
  </g>
  <path d="M800 428V493" stroke="#27788A" stroke-width="4" marker-end="url(#arr)"/>
  <text x="800" y="525" text-anchor="middle" class="body">transpose → (P, W)</text>
  <path d="M718 559H882" stroke="#27788A" stroke-width="3" marker-start="url(#back)" marker-end="url(#arr)"/>
  <text x="800" y="592" text-anchor="middle" class="body">Fold ↔ Unfold</text>
  <text x="800" y="626" text-anchor="middle" class="small">permutation only · no interpolation</text>

  <!-- Panel C: folded rows -->
  <text x="1252" y="126" text-anchor="middle" class="panel">C. Folded rows</text>
  <text x="1252" y="153" text-anchor="middle" class="small">same-channel phase rows remain adjacent</text>
  <rect x="1004" y="182" width="496" height="342" rx="10" class="box"/>
  <g opacity="0.15">
    <rect x="1025" y="210" width="445" height="61" rx="5" fill="#2E77B5"/><rect x="1025" y="278" width="445" height="61" rx="5" fill="#D8752B"/>
    <rect x="1025" y="346" width="445" height="61" rx="5" fill="#239B75"/><rect x="1025" y="414" width="445" height="61" rx="5" fill="#8558B5"/>
  </g>
  <g class="body" dominant-baseline="middle">
    <text x="1042" y="240" fill="#2E77B5">p=0</text><text x="1042" y="308" fill="#D8752B">p=1</text><text x="1042" y="376" fill="#239B75">p=2</text><text x="1042" y="444" fill="#8558B5">p=3</text>
  </g>
  <g text-anchor="middle" dominant-baseline="middle" class="idx">
    <g fill="#2E77B5"><text x="1160" y="240">0</text><text x="1250" y="240">4</text><text x="1340" y="240">8</text><text x="1430" y="240">12</text></g>
    <g fill="#D8752B"><text x="1160" y="308">1</text><text x="1250" y="308">5</text><text x="1340" y="308">9</text><text x="1430" y="308">13</text></g>
    <g fill="#239B75"><text x="1160" y="376">2</text><text x="1250" y="376">6</text><text x="1340" y="376">10</text><text x="1430" y="376">14</text></g>
    <g fill="#8558B5"><text x="1160" y="444">3</text><text x="1250" y="444">7</text><text x="1340" y="444">11</text><text x="1430" y="444">15</text></g>
  </g>
  <rect x="1210" y="287" width="180" height="108" rx="5" fill="none" stroke="#C43D3D" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M1393 327C1470 306 1510 282 1534 243" fill="none" stroke="#C43D3D" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1510" y="213" text-anchor="end" class="small" fill="#A52F2F">local CNN receptive field</text>
  <text x="1252" y="558" text-anchor="middle" class="formula">I[cP+p,w] = X[c,wP+p]</text>
  <text x="1252" y="590" text-anchor="middle" class="small">For C channels, stack these P rows channel by channel.</text>

  <rect x="354" y="674" width="892" height="58" rx="29" fill="#EAF6F3" stroke="#79B7AA" stroke-width="1.5"/>
  <text x="800" y="710" text-anchor="middle" class="panel" fill="#155462">Same samples · New adjacency · Zero parameters</text>
</svg>
