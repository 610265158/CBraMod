dataset: FACED
model_arch: vision
backbone_name: efficientnet_b0.ra4_e3600_r224_in1k
vision:
  adapter: {fold_factor: 2}
  feature_aggregation: flatten
  head_init_std: 0.002
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 50
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 5
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  mental_scale: 32.0
  shu_clip_limit: 512.0
  shu_scale: 64.0
  shu_bandpass_low: null
  shu_bandpass_high: null
  shu_filter_order: 4
  physio_lowpass_hz: null
  physio_filter_order: 4
  mumtaz_lowpass_hz: null
  mumtaz_filter_order: 4
  faced_input_norm: clip_scale
  faced_robust_clip: 8.0
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.55164, std: 0.01790}
  kappa: {mean: 0.49533, std: 0.01970}
  f1: {mean: 0.55672, std: 0.01626}
notes: >-
  Five-seed FACED flatten+FC recipe with EfficientNet-B0 RA4 weights,
  phase-interleaved fold factor P=2, head initialization std=0.002,
  weight decay 5e-4, five-epoch linear warmup, and EMA decay 0.995. No
  train-time data augmentation. Standard deviations are population statistics;
  each seed uses one validation-selected checkpoint followed by one final test
  evaluation.
output:
  model_root: experiments/checkpoints/faced_ra4_p2_flattenfc_wd5e4_warmup5_ema995_5seed/seed{seed}
  log_root: experiments/logs/vision/faced_ra4_p2_flattenfc_wd5e4_warmup5_ema995_5seed/seed{seed}
