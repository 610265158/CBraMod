dataset: HMC
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 16}
  feature_aggregation: cls_token
  head_init_std: 0.02
training:
  lr: 0.0005
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 30
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: false
  balanced_sampling: false
  mirror_augmentation: false
  time_roll_augmentation: false
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  ba: {mean: 0.67268, std: 0.00337}
  kappa: {mean: 0.61691, std: 0.00261}
  f1: {mean: 0.69975, std: 0.00270}
results:
  ba: {mean: 0.67268, std: 0.00337}
  kappa: {mean: 0.61691, std: 0.00261}
  f1: {mean: 0.69975, std: 0.00270}
notes: >-
  Pretrain-vs-random ablation: vit_small_dinov3 architecture with random initialization
  (use_pretrained_weights=false). Matches the HMC pretrained recipe; only
  the initialization differs.
output:
  model_root: experiments/checkpoints/pretrain_vs_random/vit_small_dinov3_HMC_random_init/{seed}
  log_root: experiments/logs/pretrain_vs_random/vit_small_dinov3_HMC_random_init/{seed}
