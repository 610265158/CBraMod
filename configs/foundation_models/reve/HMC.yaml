dataset: HMC
model_arch: reve
training:
  lr: 0.0001
  batch_size: 32
  epochs: 30
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  mixup_augmentation: false
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  ba:
    mean: 0.73373
    std: 0.00313
  kappa:
    mean: 0.68305
    std: 0.00461
  f1:
    mean: 0.75074
    std: 0.00324
  per_seed:
    42:
      epoch: 4
      ba: 0.73493
      kappa: 0.6834
      f1: 0.75153
    43:
      epoch: 4
      ba: 0.73118
      kappa: 0.67935
      f1: 0.74759
    44:
      epoch: 5
      ba: 0.73101
      kappa: 0.6775
      f1: 0.7474
    45:
      epoch: 3
      ba: 0.73933
      kappa: 0.69082
      f1: 0.75629
    46:
      epoch: 6
      ba: 0.7322
      kappa: 0.6842
      f1: 0.75091
notes: >-
  Matched-pipeline REVE-Base rerun on HMC. The per-dataset recipe from
  configs/downstream.py is used unchanged; the only adapted hyperparameter is
  the learning rate (1e-4). The loader normalizes inputs with the released
  REVE scale_factor (microvolt / 10, no clipping) and supplies released
  electrode positions (F4/C4/O2/C3). The REVE paper's lp -> ft warm start,
  mixup, StableAdamW, LoRA and model souping are not applied (documented
  deviation). Validation-selected checkpoint, one final test per seed, seeds
  42-46, population std. Published reference kappa 0.6982 +/- 0.0078 (delta
  -0.0151; intervals overlap). See experiments/reports/foundation_rerun_appendix.md.
output:
  model_root: experiments/checkpoints/foundation_rerun/reve/seed{seed}
  log_root: experiments/logs/foundation_rerun/reve/seed{seed}
