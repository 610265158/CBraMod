dataset: ISRUC
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 12}
  feature_aggregation: gap
  head_init_std: 0.002
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 16
  epochs: 15
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: kappa
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 10, ba: 0.81452, kappa: 0.79029, f1: 0.83753}
    43: {epoch: 10, ba: 0.81455, kappa: 0.79009, f1: 0.83708}
    44: {epoch: 9, ba: 0.81190, kappa: 0.78718, f1: 0.83417}
    45: {epoch: 10, ba: 0.81097, kappa: 0.78659, f1: 0.83396}
    46: {epoch: 9, ba: 0.80931, kappa: 0.78471, f1: 0.83250}
  mean: {ba: 0.81225, kappa: 0.78777, f1: 0.83505}
  std_population: {ba: 0.00204, kappa: 0.00214, f1: 0.00194}
notes: >-
  Unified ConvNeXt-Tiny DINOv3 recipe: lr 1e-4, weight decay 5e-4, EMA 0.995,
  grad-norm clip 1.0, warmup 3 epochs, early stop 10, dropout 0.1,
  head_init_std 0.002, gap aggregation. Five seeds 42--46, validation-selected
  checkpoint, one final test evaluation per seed, population standard
  deviation. Primary metric 0.7905 -> 0.7878 (-0.0028 vs previous per-dataset recipe).
  Per-seed values re-recorded from the w4 reproduction queue (2026-09-21).
output:
  model_root: experiments/checkpoints/isruc_convnext_tiny_dinov3_p12_gap_lr1e4_wd5e4_ema995_clip1_warm3_5seed_v1/seed{seed}
  log_root: experiments/logs/isruc_convnext_tiny_dinov3_p12_gap_lr1e4_wd5e4_ema995_clip1_warm3_5seed_v1/seed{seed}
