dataset: MentalArithmetic
backbone_name: efficientnet_b0
vision: {adapter: {fold_factor: 4}, squeeze_binary: true, head_init_std: 0.002}
training:
  lr: 0.001
  backbone_lr_scale: 0.1
  batch_size: 64
  epochs: 30
  weight_decay: 0.0005
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol: {seeds: [42, 43, 44, 45, 46], selection: validation_selected_checkpoint_once_on_test}
results:
  protocol: validation_selected_checkpoint_once_on_test
  per_seed:
    42: {ba: 0.75347, pr_auc: 0.85345, roc_auc: 0.91753}
    43: {ba: 0.69444, pr_auc: 0.78894, roc_auc: 0.87399}
    44: {ba: 0.69097, pr_auc: 0.73036, roc_auc: 0.86386}
    45: {ba: 0.69444, pr_auc: 0.84766, roc_auc: 0.89091}
    46: {ba: 0.62153, pr_auc: 0.73103, roc_auc: 0.84317}
  mean: {ba: 0.69097, pr_auc: 0.79029, roc_auc: 0.87789}
  std_population: {ba: 0.04184, pr_auc: 0.05364, roc_auc: 0.02513}
notes: MentalArithmetic P ablation; canonical EfficientNet-B0 recipe with fold factor P=4.
output:
  model_root: experiments/checkpoints/ablation_p/efficientnet_b0/mentalarithmetic_p4/seed{seed}
  log_root: experiments/logs/ablation_p/efficientnet_b0/mentalarithmetic_p4/seed{seed}
