dataset: MentalArithmetic
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 64
  epochs: 50
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.999
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 3.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 30
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  mirror_augmentation: true
  mirror_prob: 0.5
  time_roll_augmentation: true
  time_roll_prob: 0.5
  time_roll_max_fraction: 0.25
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: flatten
  seeds: [42, 43, 44, 45, 46]
  mean: {ba: 0.71181, pr_auc: 0.57394, roc_auc: 0.76186}
  std_population: {ba: 0.03534, pr_auc: 0.06172, roc_auc: 0.03888}
head_comparison:
  cls_token:
    status: complete
    seeds: [42, 43, 44, 45, 46]
    mean: {ba: 0.75486, pr_auc: 0.69924, roc_auc: 0.82188}
    std_population: {ba: 0.04011, pr_auc: 0.03928, roc_auc: 0.02365}
  recommendation: cls_token
notes: >-
  Initial five-seed ViT-Small DINOv3 MentalArithmetic probe using P=4,
  positive weight 3, mirror/time-roll augmentation, and the ConvNeXt schedule.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_mentalarithmetic_p4_flatten_wd1e2_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_mentalarithmetic_p4_flatten_wd1e2_5seed_v1/seed{seed}
