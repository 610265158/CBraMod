dataset: SHU-MI
source: configs/backbones/convnext_tiny_dinov3_unified/SHU-MI.yaml
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter: {fold_factor: 2}
  feature_aggregation: flatten
  head_init_std: 0.002
  squeeze_binary: true
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  test_each_epoch: false
  run_final_test: true
  selection_metric: pr_auc
  shu_clip_limit: 1024.0
  shu_scale: 32.0
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Frozen linear probe for configs/backbones/convnext_tiny_dinov3_unified/SHU-MI.yaml.yaml: identical recipe
  with frozen=true, so only the classifier head is updated. Five seeds 42--46,
  validation-selected checkpoint, one final test evaluation per seed.
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds: [42, 43, 44, 45, 46]
  per_seed:
    42: {epoch: 10, ba: 0.52340, pr_auc: 0.51790, roc_auc: 0.52325}
    43: {epoch: 2, ba: 0.49917, pr_auc: 0.50552, roc_auc: 0.50994}
    44: {epoch: 2, ba: 0.49300, pr_auc: 0.50512, roc_auc: 0.50798}
    45: {epoch: 8, ba: 0.51271, pr_auc: 0.51639, roc_auc: 0.52230}
    46: {epoch: 10, ba: 0.51703, pr_auc: 0.51388, roc_auc: 0.52169}
  mean: {ba: 0.50906, pr_auc: 0.51176, roc_auc: 0.51703}
  std_population: {ba: 0.01130, pr_auc: 0.00542, roc_auc: 0.00664}
output:
  model_root: experiments/checkpoints/linear_probe/convnext_tiny_dinov3_unified/shu_mi/seed{seed}
  log_root: experiments/logs/linear_probe/convnext_tiny_dinov3_unified/shu_mi/seed{seed}
