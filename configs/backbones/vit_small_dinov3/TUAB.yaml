dataset: TUAB
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 4}
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 10
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  feature_aggregation: flatten
  seeds: [42, 43, 44, 45, 46]
  mean: {ba: 0.80102, pr_auc: 0.88331, roc_auc: 0.87106}
  std_population: {ba: 0.00165, pr_auc: 0.00343, roc_auc: 0.00311}
head_comparison:
  cls_token:
    status: partial
    completed_seeds: [42]
    mean: {ba: 0.81112, pr_auc: 0.89800, roc_auc: 0.88476}
    note: Seeds 43-46 are still being rerun with num_workers=0.
  recommendation: pending
notes: >-
  Initial five-seed ViT-Small DINOv3 TUAB probe using P=4, EMA 0.995, no
  train-time augmentation, and the ConvNeXt-compatible lower learning rate.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_tuab_p4_flatten_wd1e2_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_tuab_p4_flatten_wd1e2_5seed_v1/seed{seed}
