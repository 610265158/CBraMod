dataset: SHU-MI
backbone_name: vit_small_patch16_dinov3.lvd1689m
vision:
  adapter: {fold_factor: 2}
  squeeze_binary: true
  feature_aggregation: flatten
  head_init_std: 0.02
training:
  lr: 0.0001
  backbone_lr_scale: 1.0
  batch_size: 32
  epochs: 20
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_epochs: 3
  warmup_start_factor: 0.1
  clip_value: -1.0
  ema_decay: 0.995
  num_workers: 0
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.0
  early_stop: 20
  frozen: false
  multi_lr: false
  use_pretrained_weights: true
  time_roll_augmentation: false
  shu_clip_limit: 1024.0
  shu_scale: 32.0
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds: [42, 43, 44, 45, 46]
  selection: validation_selected_checkpoint_once_on_test
notes: >-
  Five-seed ViT-Small DINOv3 SHU-MI probe with 20 epochs (the locked recipe
  uses 10). Motivated by the seed-42 20-epoch rerun (BA .6160, PR-AUC .6851)
  after the recorded 10-epoch result (.5957/.6619) looked like a possible
  failure. Formal protocol: validation-selected checkpoint, one final test.
output:
  model_root: experiments/checkpoints/vit_small_dinov3_shumi_ep20_5seed_v1/seed{seed}
  log_root: experiments/logs/vit_small_dinov3_shumi_ep20_5seed_v1/seed{seed}
