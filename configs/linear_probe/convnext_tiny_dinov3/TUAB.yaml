dataset: TUAB
backbone_name: convnext_tiny.dinov3_lvd1689m
vision:
  adapter:
    fold_factor: 4
  squeeze_binary: true
  head_init_std: 0.002
  feature_aggregation: flatten
training:
  lr: 0.0001
  backbone_lr_scale: 0.1
  batch_size: 32
  epochs: 10
  weight_decay: 0.0005
  min_lr: 1.0e-06
  warmup_epochs: 0
  warmup_start_factor: 0.1
  clip_value: 1.0
  ema_decay: 0.995
  num_workers: 4
  optimizer: AdamW
  label_smoothing: 0.1
  binary_pos_weight: 1.0
  dropout: 0.1
  drop_path_rate: 0.1
  early_stop: 10
  frozen: true
  multi_lr: false
  use_pretrained_weights: true
  balanced_sampling: false
  balanced_sampling_power: 1.0
  balanced_sampling_min_share: 0.0
  balanced_sampling_negative_ratio: 0.0
  mirror_augmentation: false
  mirror_prob: 0.5
  time_roll_augmentation: false
  time_roll_prob: 1.0
  time_roll_max_fraction: 0.5
  amplitude_scale_augmentation: false
  amplitude_scale_prob: 1.0
  amplitude_scale_min: 0.5
  amplitude_scale_max: 2.0
  amplitude_scale_distribution: log_uniform
  mixup_augmentation: false
  mixup_prob: 1.0
  mixup_alpha: 0.2
  amp: true
  amp_dtype: bfloat16
  selection_metric: pr_auc
  test_each_epoch: false
  run_final_test: true
protocol:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  selection: validation_selected_checkpoint_once_on_test
results:
  protocol: validation_selected_checkpoint_once_on_test
  seeds:
    42:
      ba: 0.79221
      pr_auc: 0.87489
      roc_auc: 0.86938
    43:
      ba: 0.78841
      pr_auc: 0.87326
      roc_auc: 0.86804
    44:
      ba: 0.79141
      pr_auc: 0.87507
      roc_auc: 0.86959
    45:
      ba: 0.79173
      pr_auc: 0.8751
      roc_auc: 0.86955
    46:
      ba: 0.7901
      pr_auc: 0.87342
      roc_auc: 0.86788
  mean:
    ba: 0.790772
    pr_auc: 0.874348
    roc_auc: 0.868888
  std_population:
    ba: 0.001373
    pr_auc: 0.000828
    roc_auc: 0.000763
notes: Five-seed (42--46) TUAB run with ConvNeXt-Tiny (v1) DINOv3 LVD-1689M self-supervised
  weights. TUAB canonical geometry (P=4, 16x2000 -> [B,1,64,500] -> 64x512), binary
  PR-AUC selection, flatten+FC head, one final test evaluation per seed. lr=1e-4 because
  the ConvNeXt family is unstable at the EfficientNet TUAB lr=1e-3; the rest of the
  schedule (ema 0.995, wd 5e-4, clip 1.0, head_init_std 0.002, no augmentation) mirrors
  the finalized EfficientNet-B0 TUAB recipe. drop_path_rate=0.1 (ConvNeXt-Tiny default)
  is added as stochastic-depth regularization against the epoch-3 overfitting seen
  in the initial drop_path=0 seed-42 run. flatten head mirrors the SHU-MI/Mumtaz fix,
  where gap (768-dim) stuck at chance but flatten (large FC) learned. num_workers=4
  is safe here because TUAB is pkl_split storage (no LMDB fork-worker segfault). Population
  standard deviations.
output:
  model_root: experiments/checkpoints/tuab_convnext_tiny_dinov3_p4_flatten_5seed_v1/seed{seed}
  log_root: experiments/logs/tuab_convnext_tiny_dinov3_p4_flatten_5seed_v1/seed{seed}
reshape_control:
  fold_mode: chunk
  source: configs/ablation_fold_geometry/convnext_tiny_dinov3/tuab_chunk.yaml
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  mean:
    ba: 0.74689
    pr_auc: 0.8603
    roc_auc: 0.80897
  std_population:
    ba: 0.1235
    pr_auc: 0.06495
    roc_auc: 0.15454
  delta_vs_fold:
    ba: -0.07469
    pr_auc: -0.04557
    roc_auc: -0.093
